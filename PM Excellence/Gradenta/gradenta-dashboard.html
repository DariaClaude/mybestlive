<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Градента · Аналитика трафика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --ink:#0f1b3d; --muted:#6b7690;
    --border:#e6e9f0; --accent:#2f6feb; --accent-soft:#eaf1ff;
    --pos:#12a150; --neg:#e0364f; --shadow:0 1px 2px rgba(15,27,61,.04),0 8px 24px rgba(15,27,61,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.4}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 56px}

  /* Header */
  .top{background:linear-gradient(135deg,#0f1b3d 0%,#1c2f63 55%,#24408a 100%);color:#fff;
    margin-bottom:26px;box-shadow:var(--shadow)}
  .top-in{max-width:1120px;margin:0 auto;padding:26px 20px 24px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:20px;flex-wrap:wrap}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .brand p{color:#aebbe0;font-size:13.5px;margin-top:3px;font-weight:500}
  .brand .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddb8f;margin-right:7px;
    vertical-align:middle;box-shadow:0 0 0 3px rgba(61,219,143,.2)}
  .controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .pills{display:flex;gap:4px;background:rgba(255,255,255,.09);padding:4px;border-radius:11px}
  .pill{border:none;background:transparent;color:#c3cdea;font:600 13px 'Inter';padding:7px 15px;
    border-radius:8px;cursor:pointer;transition:.15s}
  .pill:hover{color:#fff}
  .pill.on{background:#fff;color:var(--ink)}
  .live{font-size:12px;color:#aebbe0}
  .live b{color:#fff}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:6px}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;
    padding:3px 8px;border-radius:20px;margin-top:9px}
  .delta.up{color:var(--pos);background:rgba(18,161,80,.1)}
  .delta.down{color:var(--neg);background:rgba(224,54,79,.1)}
  .delta.flat{color:var(--muted);background:#f0f2f7}

  /* Grid */
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
  .panel h2{font-size:15px;font-weight:700;margin-bottom:2px}
  .panel .hint{font-size:12px;color:var(--muted);margin-bottom:16px;font-weight:500}

  /* Source bars */
  .src{margin-bottom:15px}
  .src:last-child{margin-bottom:0}
  .src-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .src-name{font-size:13.5px;font-weight:600}
  .src-meta{font-size:12.5px;color:var(--muted)}
  .src-meta .forms{color:var(--accent);font-weight:700;margin-left:8px}
  .bar{height:9px;background:#eef1f7;border-radius:6px;overflow:hidden}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,#2f6feb,#5b8bf5);border-radius:6px}

  /* Goals */
  .goal{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
  .goal:last-child{border-bottom:none}
  .goal-name{font-size:13.5px;font-weight:600}
  .goal-name.main{color:var(--accent)}
  .goal-conv{font-size:11.5px;color:var(--muted);margin-top:2px}
  .goal-val{font-size:22px;font-weight:800;letter-spacing:-.5px}

  /* Sites */
  .site{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
  .site:last-child{border-bottom:none}
  .site a{color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;word-break:break-all}
  .site a:hover{color:var(--accent)}
  .site .v{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;margin-left:12px}

  /* Chart */
  .chart-wrap{margin-top:6px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:130px;padding-top:10px}
  .cbar{flex:1;min-width:2px;background:#cdd7ee;border-radius:2px 2px 0 0;transition:.15s;position:relative}
  .cbar:hover{background:var(--accent)}
  .cbar.y{background:var(--accent)}
  .cbar.today{background:#9db6ee;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.5) 3px,rgba(255,255,255,.5) 4px)}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;font-weight:500}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  .msg{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;
    box-shadow:var(--shadow);color:var(--muted);font-size:14px;line-height:1.7}
  .msg code{background:#f0f2f7;padding:2px 7px;border-radius:5px;color:var(--ink);font-size:13px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .top-in{align-items:flex-start}
    .controls{align-items:flex-start}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Градента</h1>
      <p><span class="dot"></span>Аналитика трафика · gradenta.info</p>
    </div>
    <div class="controls">
      <div class="pills" id="pills">
        <button class="pill" data-p="Вчера">Вчера</button>
        <button class="pill on" data-p="7 дней">7 дней</button>
        <button class="pill" data-p="30 дней">30 дней</button>
        <button class="pill" data-p="90 дней">90 дней</button>
      </div>
      <div class="live" id="live"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="app"><div class="msg">Загружаем данные из Яндекс Метрики…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ───────────── КОНФИГ ─────────────
// Вставьте ID таблицы (из логов функции setup) сюда,
// либо открывайте дашборд как ...gradenta-dashboard.html?id=<ID>
const SHEET_ID = '';

const GID = new URLSearchParams(location.search).get('id') || SHEET_ID;
const METRIC_COLS = 7; // Дата + 6 базовых метрик; дальше идут колонки целей
const MAIN_GOAL = 'Отправка формы';

let STATE = { period: '7 дней', overview:null, sources:null, sites:null, meta:null, goalCols:[] };

// ───────────── ЗАГРУЗКА ─────────────
async function gviz(tab){
  const url = `https://docs.google.com/spreadsheets/d/${GID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[\s\S]*?setResponse\(/, '').replace(/\);?\s*$/, ''));
  const cols = json.table.cols.map((c,i)=> (c.label && c.label.trim()) || c.id || ('c'+i));
  const rows = json.table.rows.map(r=>{
    const o = {};
    r.c.forEach((cell,i)=>{
      let v = null;
      if(cell){ v = (cell.v !== null && cell.v !== undefined) ? cell.v : (cell.f ?? null); }
      o[cols[i]] = v;
    });
    return o;
  });
  return { cols, rows };
}

async function load(){
  if(!GID){ return showMsg(
    'Не указан ID таблицы. Запустите функцию <code>setup</code> в Apps Script, '+
    'скопируйте ID из логов и вставьте его в константу <code>SHEET_ID</code> '+
    'или откройте дашборд как <code>?id=ВАШ_ID</code>.'); }
  try{
    const [ov, sr, st, mt] = await Promise.all([
      gviz('Обзор'), gviz('Источники'), gviz('Сайты'), gviz('Мета').catch(()=>null)
    ]);
    STATE.overview = ov;
    STATE.sources  = sr;
    STATE.sites    = st;
    STATE.meta     = mt;
    STATE.goalCols = ov.cols.slice(METRIC_COLS);
    bindPills();
    render();
  }catch(e){
    showMsg('Не удалось прочитать таблицу. Проверьте, что доступ выставлен как '+
      '«Все, у кого есть ссылка → Читатель», и что ID верный.<br><br>'+
      '<span style="font-size:12px">'+String(e)+'</span>');
  }
}

// ───────────── АГРЕГАЦИЯ ─────────────
function num(x){ const n = typeof x==='number'? x : parseFloat(String(x).replace(',','.')); return isNaN(n)?0:n; }

function periodRange(){
  const rows = STATE.overview.rows;
  const n = rows.length;
  const iY = n-2;            // «вчера» — предпоследняя дата (последняя = сегодня, неполная)
  if(iY < 0) return [0, n-1];
  const end = iY;
  const span = { 'Вчера':1, '7 дней':7, '30 дней':30, '90 дней':1e9 }[STATE.period];
  const start = Math.max(0, end - span + 1);
  return [start, end];
}

function agg(s, e){
  const rows = STATE.overview.rows;
  let visits=0, users=0, pv=0, bw=0, dw=0, tw=0;
  const goals = {}; STATE.goalCols.forEach(g=>goals[g]=0);
  for(let i=s;i<=e && i<rows.length;i++){
    const r = rows[i]; const v = num(r['Визиты']);
    visits+=v; users+=num(r['Посетители']); pv+=num(r['Просмотры']);
    bw += num(r['Отказы %'])*v; dw += num(r['Глубина'])*v; tw += num(r['Время, сек'])*v;
    STATE.goalCols.forEach(g=> goals[g]+=num(r[g]));
  }
  return { visits, users, pv, goals,
    bounce: visits? bw/visits:0, depth: visits? dw/visits:0, dur: visits? tw/visits:0 };
}

function prevRange(s,e){ const len=e-s+1; const pe=s-1; if(pe<0) return null; return [Math.max(0,pe-len+1), pe]; }

// ───────────── РЕНДЕР ─────────────
function render(){
  const [s,e] = periodRange();
  const cur = agg(s,e);
  const pr = prevRange(s,e);
  const prev = pr? agg(pr[0],pr[1]) : null;
  const rows = STATE.overview.rows;
  const dFrom = rows[s]?.['Дата'], dTo = rows[e]?.['Дата'];

  const app = document.getElementById('app');
  app.innerHTML =
    kpiBlock(cur, prev) +
    `<div class="grid">
       <div class="panel">${sourcesBlock(s,e,cur.visits)}</div>
       <div class="panel">${goalsBlock(cur)}</div>
     </div>
     <div class="panel">${chartBlock()}</div>
     <div class="panel" style="margin-top:16px">${sitesBlock()}</div>`;

  // «в моменте» и период в шапке
  const today = rows[rows.length-1];
  document.getElementById('live').innerHTML =
    `Сегодня в моменте: <b>${num(today?.['Визиты'])}</b> визитов · период: <b>${ruDate(dFrom)} — ${ruDate(dTo)}</b>`;

  const upd = STATE.meta ? (STATE.meta.rows.find(r=>r['Ключ']==='Обновлено')||{})['Значение'] : '';
  document.getElementById('foot').innerHTML =
    `Источник: Яндекс Метрика · счётчик 109163509 · gradenta.info<br>`+
    (upd? `Данные обновлены: ${upd}`:'') +
    `<br>Многодневные «посетители» — сумма по дням (возможен повтор уникальных); «вчера» — точное значение.`;
}

function kpi(lbl, val, sub, delta, invert){
  let d = '';
  if(delta !== null && delta !== undefined){
    const cls = delta>0 ? (invert?'down':'up') : delta<0 ? (invert?'up':'down') : 'flat';
    const arr = delta>0?'▲':delta<0?'▼':'—';
    d = `<div class="delta ${cls}">${arr} ${Math.abs(delta).toFixed(0)}%</div>`;
  }
  return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div>`+
         `<div class="sub">${sub||''}</div>${d}</div>`;
}
function pct(cur,prev){ if(prev===null) return null; if(prev===0) return cur>0?100:0; return (cur-prev)/prev*100; }

function kpiBlock(cur, prev){
  const forms = cur.goals[MAIN_GOAL]||0;
  const formsPrev = prev? (prev.goals[MAIN_GOAL]||0) : null;
  const conv = cur.visits? (forms/cur.visits*100):0;
  return `<div class="kpis">
    ${kpi('Визиты', fmt(cur.visits), 'за период', pct(cur.visits, prev?prev.visits:null))}
    ${kpi('Посетители', fmt(cur.users), 'уникальные', pct(cur.users, prev?prev.users:null))}
    ${kpi('Отказы', cur.bounce.toFixed(1)+'%', 'глубина '+cur.depth.toFixed(1)+' стр.', pct(cur.bounce, prev?prev.bounce:null), true)}
    ${kpi('Отправка формы', fmt(forms), 'конверсия '+conv.toFixed(1)+'%', pct(forms, formsPrev))}
  </div>`;
}

function sourcesBlock(s,e, totalVisits){
  const dFrom = STATE.overview.rows[s]['Дата'], dTo = STATE.overview.rows[e]['Дата'];
  const map = {};
  STATE.sources.rows.forEach(r=>{
    const d = r['Дата']; if(d < dFrom || d > dTo) return;
    const name = r['Источник']||'—';
    if(!map[name]) map[name] = {visits:0, forms:0};
    map[name].visits += num(r['Визиты']);
    map[name].forms  += num(r['Формы']);
  });
  const list = Object.entries(map).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.visits-a.visits);
  const total = totalVisits || list.reduce((s,x)=>s+x.visits,0) || 1;
  let body = list.length ? list.map(x=>{
    const share = x.visits/total*100;
    return `<div class="src">
      <div class="src-top">
        <span class="src-name">${esc(x.name)}</span>
        <span class="src-meta">${x.visits} · ${share.toFixed(0)}%${x.forms?`<span class="forms">${x.forms} форм</span>`:''}</span>
      </div>
      <div class="bar"><span style="width:${Math.max(share,1.5)}%"></span></div>
    </div>`;
  }).join('') : '<div class="empty">За выбранный период визитов не было.</div>';
  return `<h2>Источники трафика</h2><div class="hint">Откуда пришли посетители · форм по источнику</div>${body}`;
}

function goalsBlock(cur){
  const body = STATE.goalCols.map(g=>{
    const val = cur.goals[g]||0;
    const conv = cur.visits? (val/cur.visits*100):0;
    return `<div class="goal">
      <div><div class="goal-name ${g===MAIN_GOAL?'main':''}">${esc(g)}</div>
      <div class="goal-conv">конверсия ${conv.toFixed(1)}%</div></div>
      <div class="goal-val">${val}</div></div>`;
  }).join('');
  return `<h2>Цели (формы)</h2><div class="hint">Выполнено за выбранный период</div>${body}`;
}

function sitesBlock(){
  const rows = STATE.sites.rows.filter(r=>r['Сайт'] && !String(r['Сайт']).startsWith('—')).slice(0,10);
  const body = rows.length ? rows.map(r=>{
    const url = String(r['Сайт']);
    const disp = url.replace(/^https?:\/\//,'').replace(/\/$/,'');
    return `<div class="site"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(disp)}</a>`+
           `<span class="v">${num(r['Визиты'])}</span></div>`;
  }).join('') : '<div class="empty">Реферальных переходов за 30 дней не было.</div>';
  return `<h2>Сайты-доноры</h2><div class="hint">Конкретные ресурсы, откуда переходили · за 30 дней</div>${body}`;
}

function chartBlock(){
  const rows = STATE.overview.rows;
  const vis = rows.map(r=>num(r['Визиты']));
  const max = Math.max(1, ...vis);
  const iY = rows.length-2, iToday = rows.length-1;
  const bars = rows.map((r,i)=>{
    const h = Math.max(2, vis[i]/max*118);
    const cls = i===iToday?'today':(i===iY?'y':'');
    return `<div class="cbar ${cls}" style="height:${h}px" title="${ruDate(r['Дата'])}: ${vis[i]} визитов"></div>`;
  }).join('');
  const first = ruDate(rows[0]?.['Дата']), last = ruDate(rows[iToday]?.['Дата']);
  return `<h2>Динамика визитов</h2><div class="hint">По дням за 90 дней · синим — вчера, штриховкой — сегодня (неполный день)</div>
    <div class="chart-wrap"><div class="bars">${bars}</div>
    <div class="axis"><span>${first}</span><span>${last}</span></div></div>`;
}

// ───────────── УТИЛИТЫ ─────────────
function bindPills(){
  document.querySelectorAll('.pill').forEach(b=>{
    b.classList.toggle('on', b.dataset.p===STATE.period);
    b.onclick = ()=>{
      STATE.period = b.dataset.p;
      document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on', x===b));
      render();
    };
  });
}
function fmt(n){ return (Math.round(n)||0).toLocaleString('ru-RU'); }
function ruDate(s){ if(!s) return '—'; const p=String(s).split('-'); return p.length===3? p[2]+'.'+p[1]:s; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showMsg(html){ document.getElementById('app').innerHTML = `<div class="msg">${html}</div>`; }

load();
</script>
</body>
</html>
