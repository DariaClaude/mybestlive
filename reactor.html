<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05070F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Реактор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1100px 500px at 70% -10%, rgba(124,107,255,0.14), transparent 60%),
                radial-gradient(800px 500px at 10% 110%, rgba(61,255,197,0.08), transparent 55%), #05070F;
    font-family: 'Manrope', system-ui, sans-serif; color: #E8ECF8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 580px; margin: 0 auto; padding: max(26px, env(safe-area-inset-top)) 16px 48px; position: relative; }
  .panel {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(124,107,255,0.16);
    border-radius: 18px; padding: 18px; backdrop-filter: blur(8px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 26px; margin: 6px 0 14px;
       color: #fff; letter-spacing: 1px; text-shadow: 0 0 24px rgba(124,107,255,0.45); }
  h1 b { color: #7C6BFF; font-weight: 900; }
  h2 { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #C9D2E8; }
  .date { font-size: 11px; color: #5E6B8C; letter-spacing: 3px; text-transform: uppercase; }
  .statusrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .lvl { font-family:'Unbounded',sans-serif; font-size: 11px; font-weight: 700; color: #3DFFC5;
         letter-spacing: 1px; text-shadow: 0 0 10px rgba(61,255,197,0.6); }
  .xpbar { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08);
           overflow: hidden; border: 1px solid rgba(124,107,255,0.3); }
  .xpbar i { display:block; height:100%; background: linear-gradient(90deg,#7C6BFF,#3DFFC5);
             box-shadow: 0 0 10px rgba(124,107,255,0.8); transition: width .6s ease; }
  .xpnum { font-size: 12px; color: #5E6B8C; }
  .streak { font-size: 12px; font-weight: 800; color: #FF6B35; text-shadow: 0 0 10px rgba(255,107,53,0.6); }
  .combo { font-size: 12px; font-weight: 800; color: #FFB020; text-shadow: 0 0 10px rgba(255,176,32,0.6); }
  .cores { display: flex; gap: 6px; justify-content: space-between; padding: 26px 10px 20px; }
  .core { text-align: center; flex: 1; min-width: 96px; position: relative; }
  .bat { position: relative; width: 72px; height: 140px; margin: 0 auto; }
  .cap { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
         width: 26px; height: 10px; border-radius: 5px 5px 0 0; transition: all .9s ease; }
  .body { position: absolute; top: 10px; left: 0; right: 0; bottom: 0; border-radius: 16px;
          overflow: hidden; background: linear-gradient(180deg,#0B1024,#060814);
          transition: box-shadow .9s ease, border-color .9s ease; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0;
          transition: height .9s cubic-bezier(.22,1,.36,1); }
  .flow { position: absolute; inset: 0; mix-blend-mode: overlay;
          background: repeating-linear-gradient(180deg, rgba(255,255,255,0.22) 0 3px, transparent 3px 14px);
          animation: flowUp 1.6s linear infinite; }
  .meniscus { position: absolute; top: -2px; left: 4px; right: 4px; height: 5px; border-radius: 4px;
              background: rgba(255,255,255,0.7); filter: blur(2px); }
  .tick { position: absolute; right: 4px; width: 9px; height: 1.5px; border-radius: 1px; }
  .pct { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pct b { font-family:'Unbounded',sans-serif; font-size: 24px; font-weight: 700; color: #fff; }
  .pct s { font-size: 9px; letter-spacing: 2px; color: #fff; opacity: .85; text-decoration: none; }
  .burst { position: absolute; inset: 4px -8px -8px; border-radius: 20px;
           animation: burstRing .8s ease-out forwards; pointer-events: none; }
  .corename { margin-top: 14px; font-family:'Unbounded',sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; }
  .corehint { font-size: 10.5px; color: #5E6B8C; margin-top: 4px; line-height: 1.4; padding: 0 4px; }
  .mini { width: 30px; height: 30px; border-radius: 15px; cursor: pointer;
          background: rgba(var(--g),0.10); color: rgb(var(--g));
          border: 1px solid rgba(var(--g),0.45); font-size: 16px; line-height: 1;
          font-family: inherit; transition: box-shadow .2s, background .2s; }
  .mini.sm { width: 24px; height: 24px; font-size: 13px; }
  .mini:active, .mini:hover { background: rgba(var(--g),0.22); box-shadow: 0 0 12px rgba(var(--g),0.5); }
  .quest { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .qbar { display: flex; gap: 5px; margin-top: 6px; }
  .qseg { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); transition: all .4s; }
  .qseg.on { background: linear-gradient(90deg,#3DFFC5,#7C6BFF); box-shadow: 0 0 8px rgba(61,255,197,0.6); }
  .qstat { font-family:'Unbounded',sans-serif; font-size: 13px; font-weight: 700; color: #5E6B8C; }
  .qstat.done { color: #3DFFC5; text-shadow: 0 0 10px rgba(61,255,197,0.7); }
  .task { display: flex; align-items: center; gap: 10px; padding: 10px 2px;
          border-bottom: 1px solid rgba(255,255,255,0.05); }
  .check { width: 30px; height: 30px; border-radius: 15px; flex-shrink: 0; cursor: pointer;
           border: 1px solid rgba(255,176,32,0.5); background: rgba(255,176,32,0.10);
           color: #FFB020; font-size: 14px; line-height: 1; font-family: inherit; }
  .tname { font-size: 14px; font-weight: 600; color: #E8ECF8; }
  .badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: .5px; border-radius: 6px; padding: 2px 8px; }
  .ghost { width: 26px; height: 26px; border-radius: 8px; border: none; background: transparent;
           color: #39435E; cursor: pointer; font-size: 13px; font-family: inherit; }
  .primary { border: 1px solid rgba(124,107,255,0.5); border-radius: 10px;
             background: linear-gradient(135deg, rgba(124,107,255,0.25), rgba(61,255,197,0.15));
             color: #fff; padding: 11px 18px; font-family:'Unbounded',sans-serif;
             font-size: 11px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer;
             box-shadow: 0 0 20px rgba(124,107,255,0.25); }
  .form { margin-top: 12px; padding: 14px; border-radius: 14px;
          background: rgba(124,107,255,0.06); border: 1px solid rgba(124,107,255,0.2); }
  .form input[type=text] { width: 100%; padding: 11px 13px; border-radius: 10px;
          border: 1px solid rgba(124,107,255,0.35); font-size: 16px; font-family: inherit;
          background: #0B1024; color: #E8ECF8; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .ptabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .ptab { border: none; background: transparent; color: #5E6B8C; border-radius: 8px;
          padding: 5px 10px; font-size: 12px; font-weight: 700; font-family: inherit;
          cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .ptab.on { color: #3DFFC5; border-bottom-color: #3DFFC5;
             text-shadow: 0 0 8px rgba(61,255,197,0.5); }
  .preset { border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04);
            color: #C9D2E8; border-radius: 20px; padding: 5px 12px; font-size: 12px;
            font-family: inherit; cursor: pointer; transition: all .2s; }
  .preset:hover, .preset:active { border-color: rgba(61,255,197,0.6); color: #3DFFC5;
            box-shadow: 0 0 10px rgba(61,255,197,0.3); }
  .steppers { display: flex; gap: 8px; flex-wrap: wrap; }
  .stepper { display: flex; align-items: center; gap: 7px; border-radius: 10px; padding: 6px 9px; }
  .stepper .nm { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; min-width: 56px; font-family:'Unbounded',sans-serif; }
  .stepper .val { min-width: 32px; text-align: center; font-size: 13px; font-weight: 800; }
  .hintline { font-size: 12px; color: #5E6B8C; margin: 12px 0 8px; }
  .empty { font-size: 13.5px; color: #5E6B8C; margin: 4px 0 14px; line-height: 1.5; }
  .chartbox svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 14px; margin-top: 8px; justify-content: center; }
  .legend span { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .achs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .ach { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 6px 10px;
         font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.10);
         background: rgba(255,255,255,0.03); color: #39435E; }
  .ach.on { border-color: rgba(255,176,32,0.5); color: #FFB020;
            box-shadow: 0 0 12px rgba(255,176,32,0.25); background: rgba(255,176,32,0.07); }
  .footerbtns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
  .footerbtns button { border: 1px solid rgba(255,255,255,0.12); background: transparent;
         color: #5E6B8C; border-radius: 10px; padding: 8px 14px; font-size: 12px;
         font-family: inherit; cursor: pointer; }
  .logtitle { font-size: 10px; color: #5E6B8C; text-transform: uppercase; letter-spacing: 2px; margin: 16px 0 6px; padding: 0 6px; }
  .logline { font-size: 12px; color: #5E6B8C; padding: 3px 6px; display: flex; gap: 10px; }
  .logline time { color: #39435E; font-variant-numeric: tabular-nums; }
  .lvlflash { position: fixed; top: 50%; left: 50%; z-index: 50; transform: translate(-50%,-50%);
              animation: lvlPop 1.6s ease forwards; font-family:'Unbounded',sans-serif;
              font-weight: 900; font-size: 30px; color: #fff; text-align: center;
              text-shadow: 0 0 30px #7C6BFF, 0 0 60px #3DFFC5; pointer-events: none; }
  .lvlflash small { font-size: 15px; color: #3DFFC5; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 60;
           background: rgba(11,16,36,0.95); border: 1px solid rgba(255,176,32,0.5);
           color: #FFB020; border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 700;
           box-shadow: 0 0 24px rgba(255,176,32,0.35); animation: toastIn 3s ease forwards; }
  .stars { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; opacity: .35; filter: blur(.5px);
          animation: starDrift linear infinite; }
  .low-pulse { animation: lowPulse 1.4s ease-in-out infinite; }

  /* ── диагностика ── */
  .diaghead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .verdict { font-size: 12px; font-weight: 800; }
  .verdict.bad { color: #FF5C7A; text-shadow: 0 0 10px rgba(255,92,122,0.4); }
  .verdict.good { color: #3DFFC5; text-shadow: 0 0 10px rgba(61,255,197,0.4); }
  .diagrow { padding: 10px 12px; margin-top: 8px; border-radius: 12px;
             background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); }
  .drtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .drtop b { font-family:'Unbounded',sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
  .drwhy { font-size: 12px; color: #7C86AD; margin-top: 5px; line-height: 1.5; }
  .chip { font-size: 9px; font-weight: 700; letter-spacing: 1px; border-radius: 6px; padding: 3px 7px;
          font-family:'Unbounded',sans-serif; }
  .chip.ok { color: #3DFFC5; background: rgba(61,255,197,0.08); border: 1px solid rgba(61,255,197,0.3); }
  .chip.warn { color: #FFB020; background: rgba(255,176,32,0.10); border: 1px solid rgba(255,176,32,0.35); }
  .chip.crit { color: #FF5C7A; background: rgba(255,92,122,0.12); border: 1px solid rgba(255,92,122,0.45);
               animation: lowPulse 1.8s ease-in-out infinite; }
  .recs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
  .recs .preset i { font-style: normal; font-weight: 800; color: #3DFFC5; margin-left: 4px; }
  .diagmeta { font-size: 11px; color: #5E6B8C; margin-top: 10px; line-height: 1.5; }
  .subbtn { border: 1px solid rgba(124,107,255,0.35); background: rgba(124,107,255,0.08); color: #C9D2E8;
            border-radius: 9px; padding: 5px 11px; font-size: 11.5px; font-weight: 700;
            font-family: inherit; cursor: pointer; }
  .subbtn:hover { border-color: rgba(124,107,255,0.7); box-shadow: 0 0 10px rgba(124,107,255,0.3); }

  /* ── ритуалы ── */
  .srctag { font-size: 9.5px; font-weight: 800; letter-spacing: .3px; border-radius: 5px; padding: 2px 6px;
            margin-left: 6px; white-space: nowrap; color: #7C6BFF;
            background: rgba(124,107,255,0.12); border: 1px solid rgba(124,107,255,0.3); }
  .srctag.live { color: #3DFFC5; background: rgba(61,255,197,0.10); border-color: rgba(61,255,197,0.32); }
  .ritrow { display: flex; align-items: flex-start; gap: 10px; padding: 11px 2px;
            border-bottom: 1px solid rgba(255,255,255,0.05); }
  .daysel { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .daybtn { min-width: 32px; height: 25px; border-radius: 7px; font-size: 10.5px; font-weight: 700;
            cursor: pointer; font-family: inherit; color: #5E6B8C; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.10); transition: all .2s; }
  .daybtn.on { color: #3DFFC5; border-color: rgba(61,255,197,0.5); background: rgba(61,255,197,0.08);
               box-shadow: 0 0 8px rgba(61,255,197,0.2); }
  .switch { display: inline-flex; align-items: center; gap: 9px; border: 1px solid rgba(255,255,255,0.12);
            background: transparent; color: #5E6B8C; border-radius: 10px; padding: 7px 12px;
            font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .2s; }
  .switch i { width: 30px; height: 16px; border-radius: 8px; background: rgba(255,255,255,0.10);
              position: relative; transition: all .2s; }
  .switch i:after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
                    border-radius: 50%; background: #5E6B8C; transition: all .2s; }
  .switch.on { color: #3DFFC5; border-color: rgba(61,255,197,0.45); }
  .switch.on i { background: rgba(61,255,197,0.25); }
  .switch.on i:after { left: 16px; background: #3DFFC5; box-shadow: 0 0 8px rgba(61,255,197,0.8); }
  .repeat { margin-top: 14px; }

  /* ── разбор недели ── */
  .wsum { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .verdict.flat { color: #7C86AD; }
  .wrow { padding: 10px 12px; margin-top: 8px; border-radius: 12px;
          background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); }
  .wtop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .wtop b { font-family:'Unbounded',sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
  .wdelta { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .wrange { font-size: 11.5px; color: #5E6B8C; font-variant-numeric: tabular-nums; margin-left: auto; }
  .wmeta { font-size: 12px; color: #7C86AD; margin-top: 4px; line-height: 1.5; }
  .reclabel { font-size: 11px; color: #5E6B8C; margin-right: 2px; }

  @keyframes flowUp { from { background-position-y: 0; } to { background-position-y: -28px; } }
  @keyframes lowPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
  @keyframes burstRing { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(-140px); } }
  @keyframes lvlPop { 0% { transform: translate(-50%,-50%) scale(.6); opacity: 0; }
    15% { opacity: 1; } 70% { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.15); opacity: 0; } }
  @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, 14px); }
    10%,80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  button:focus-visible, input:focus-visible { outline: 2px solid #7C6BFF; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

function load() {
  var def = { batteries:{energy:60,spirit:60,focus:60}, tasks:[], done:[], xp:0, log:[],
              streak:{count:0,lastDate:null}, combo:{count:0,date:null},
              history:[], lastVisit:null, totalDone:0, ach:[],
              rituals:[], skipped:[], lastRoll:null };
  try {

    if (raw) {

      for (var k in def) if (!(k in p)) p[k] = def[k];

      return p;
    }
  } catch(e) {}

/* ── сутки реактора: 6:00 → 6:00 по Москве ── */
function mskNow() {
  var n = new Date();
  return new Date(n.getTime() + n.getTimezoneOffset()*60000 + MSK_OFFSET*3600000);
}
function reactorDate() {
  var m = mskNow();
  m.setHours(m.getHours() - DAY_START);
  return m;
}
function today() { return reactorDate().toLocaleDateString("ru-RU"); }
function toDate(s) { var p = s.split("."); return new Date(+p[2], +p[1]-1, +p[0]); }
function weekdayOf(s) { var w = toDate(s).getDay(); return w === 0 ? 7 : w; }
function dayIndex(s) { return Math.floor(toDate(s).getTime() / 86400000); }
function isYesterday(d) { return !!d && daysBetween(d, today()) === 1; }
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function fmt(v) { return v > 0 ? "+"+v : ""+v; }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nextId() { idSeq = Math.max(idSeq + 1, Date.now()); return idSeq; }
function pushLog(text) {
  state.log.unshift({ time: mskNow().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}), text: text });
  state.log = state.log.slice(0, 14);
}
function ruWord(n, one, few, many) { var m10=n%10, m100=n%100;
  if (m10===1 && m100!==11) return one;
  if (m10>=2 && m10<=4 && (m100<10||m100>=20)) return few;
  return many; }
function ruDays(n){ return ruWord(n, "день", "дня", "дней"); }
function daysLabel(days) {
  if (days.length === 7) return "каждый день";
  if (days.length === 5 && days.indexOf(6) === -1 && days.indexOf(7) === -1) return "по будням";
  if (days.length === 2 && days.indexOf(6) !== -1 && days.indexOf(7) !== -1) return "по выходным";
  return days.slice().sort(function(a,b){return a-b;}).map(function(d){ return DAY_NAMES[d-1]; }).join(", ");
}

/* ── новый день: снимок в историю, списание неиспользованного, саморазряд, утренняя загрузка ── */
function handleNewDay() {
  var d = today();
  if (!state.lastVisit) { state.lastVisit = d; rollMorning(d); save(); return; }
  if (state.lastVisit !== d) {
    state.history.push({
      date: state.lastVisit,
      energy: state.batteries.energy, spirit: state.batteries.spirit, focus: state.batteries.focus
    });
    state.history = state.history.slice(-30);
    expireTasks(state.lastVisit);
    var missed = Math.min(daysBetween(state.lastVisit, d), 3);
    if (missed > 0) {
      var drain = 8 * missed;
      CORES.forEach(function(c){ state.batteries[c.id] = Math.max(5, state.batteries[c.id] - drain); });
      pushLog("Ночной саморазряд: −" + drain + " всем батареям. Доброе утро — пора заряжаться!");
    }
    state.lastVisit = d;
  }
  rollMorning(d);
  save();
}

/* всё, что не сделано за прошлые сутки, уходит в неиспользованное */
function expireTasks(dateKey) {
  if (!state.tasks.length) return;
  var n = state.tasks.length;
  state.tasks.forEach(function(t){
    state.skipped.unshift({ name:t.name, effects:t.effects, date:dateKey, src:t.src || "manual" });
  });
  state.skipped = state.skipped.slice(0, 80);
  state.tasks = [];
  pushLog("Не израсходовано за " + dateKey + ": " + n + " " +
          ruWord(n, "задача списана", "задачи списаны", "задач списано"));
}

/* утренняя загрузка: ритуалы дня + добор задач по просевшим сферам */
function rollMorning(d) {
  if (state.lastRoll === d) return;
  var wd = weekdayOf(d), added = 0;
  state.rituals.forEach(function(r){
    if (r.days.indexOf(wd) === -1 || r.lastAdded === d) return;
    r.lastAdded = d;
    state.tasks.push({ id: nextId(), name: r.name, effects: Object.assign({}, r.effects),
                       src: "ritual", ritualId: r.id });
    added++;
  });
  if (added) pushLog("Утренняя загрузка: " + added + " " + ruWord(added,"ритуал","ритуала","ритуалов") + " в плане");
  autoBoost();
  state.lastRoll = d;
}

/* ── анализ сфер ── */
function chargeLast(coreId, days) {
  var sum = 0;
  state.done.forEach(function(t){
    if (!t.doneAt) return;
    var diff = daysBetween(t.doneAt, today());
    if (diff >= 0 && diff < days && t.effects[coreId] > 0) sum += t.effects[coreId];
  });
  return sum;
}
function skippedLast(days) {
  return state.skipped.filter(function(s){
    var diff = daysBetween(s.date, today());
    return diff >= 0 && diff < days;
  }).length;
}
function analyze() {
  var hist = state.history.slice(-7);
  return CORES.map(function(c){
    var v = state.batteries[c.id];
    var base = hist.length ? hist[0][c.id] : v;
    var trend = v - base;
    var charge = chargeLast(c.id, 7);
    var low = v < 50 ? 1 : 0;
    for (var i = hist.length - 1; i >= 0; i--) { if (hist[i][c.id] < 50) low++; else break; }
    var hasBase = state.history.length >= 2 || state.done.length > 0;   /* есть ли на чём строить вывод */
    var status = "ok";
    if (v < 35 || (v < 55 && trend <= -10) || (hasBase && v < 50 && charge === 0)) status = "crit";
    else if (v < 55 || (hasBase && (trend <= -12 || charge < 15))) status = "warn";
    var why = [v + "%"];
    if (hist.length >= 2) {
      if (trend <= -4) why.push("−" + Math.abs(trend) + " за неделю");
      else if (trend >= 4) why.push("+" + trend + " за неделю");
      else why.push("держится ровно");
    }
    if (low >= 2) why.push("ниже половины " + low + " " + ruDays(low) + " подряд");
    why.push(charge > 0 ? "заряжающих задач за неделю на +" + charge
                        : "за неделю ни одной заряжающей задачи");
    return { core:c, v:v, trend:trend, charge:charge, low:low, status:status, why:why.join(" · ") };
  });
}
/* итоги сферы за неделю: динамика, коридор, что заряжало и что сжигало */
function weekStats(coreId) {
  var d = today();
  var series = state.history.slice(-7).map(function(h){ return h[coreId]; });
  series.push(state.batteries[coreId]);
  var first = series[0], last = series[series.length - 1], sum = 0, min = 100, max = 0;
  series.forEach(function(v){ sum += v; if (v < min) min = v; if (v > max) max = v; });
  var charge = 0, drain = 0, count = 0, byName = {};
  state.done.forEach(function(t){
    if (!t.doneAt) return;
    var diff = daysBetween(t.doneAt, d);
    if (diff < 0 || diff >= 7) return;
    var e = t.effects[coreId] || 0;
    if (e > 0) { charge += e; count++; byName[t.name] = (byName[t.name] || 0) + e; }
    else if (e < 0) drain += e;
  });
  var top = null;
  for (var nm in byName) if (!top || byName[nm] > top.sum) top = { name:nm, sum:byName[nm] };
  var delta = last - first;
  return { first:first, last:last, delta:delta, avg:Math.round(sum / series.length),
           min:min, max:max, charge:charge, drain:drain, count:count, top:top,
           days:series.length, dir: delta >= 5 ? "up" : delta <= -5 ? "down" : "flat" };
}
/* подбор задач под сферу: сильнее заряжают, не дублируют план,
   не повторяют недавнее и берутся из разных категорий — ради разнообразия */
function pickTasks(coreId, n, opts) {
  opts = opts || {};
  var exclude = opts.exclude || {}, perCat = opts.perCat || 1, d = today();
  var busy = {};
  state.tasks.forEach(function(t){ busy[t.name] = 1; });
  state.done.forEach(function(t){ if (t.doneAt === d) busy[t.name] = 1; });
  var skipCount = {}, doneCount = {};
  state.skipped.forEach(function(s){
    if (daysBetween(s.date, d) < 7) skipCount[s.name] = (skipCount[s.name] || 0) + 1;
  });
  state.done.forEach(function(t){
    if (t.doneAt && daysBetween(t.doneAt, d) < 3) doneCount[t.name] = (doneCount[t.name] || 0) + 1;
  });
  var pool = [];
  PRESET_CATS.forEach(function(cat){
    cat.items.forEach(function(p){
      if (p.e[coreId] <= 0 || busy[p.name] || exclude[p.name]) return;
      /* чем ниже соседняя батарея, тем дороже обходится задача, которая её жжёт */
      var harm = 0;
      CORES.forEach(function(o){
        if (o.id === coreId || p.e[o.id] >= 0) return;
        var lvl = state.batteries[o.id];
        harm += -p.e[o.id] * (lvl < 50 ? 1.2 : lvl < 70 ? 0.6 : 0.3);
      });
      var w = p.e[coreId] - (skipCount[p.name] || 0) * 6 - (doneCount[p.name] || 0) * 3 - harm;
      if (w <= 0) return;
      pool.push({ name:p.name, e:p.e, cat:cat.id, catName:cat.name, w:w });
    });
  });
  if (!pool.length) return [];
  pool.sort(function(a,b){ return b.w - a.w || (a.name < b.name ? -1 : 1); });
  var top = pool.slice(0, Math.max(n + 8, 12));
  var off = (dayIndex(d) + (opts.seed || 0)) % top.length;
  var order = top.slice(off).concat(top.slice(0, off));
  var out = [], catUsed = {};
  for (var pass = 1; pass <= 2 && out.length < n; pass++) {
    for (var i = 0; i < order.length && out.length < n; i++) {
      var p = order[i];
      if (out.indexOf(p) !== -1) continue;
      if (pass === 1 && (catUsed[p.cat] || 0) >= perCat) continue;
      out.push(p); catUsed[p.cat] = (catUsed[p.cat] || 0) + 1;
    }
  }
  out.sort(function(a,b){ return b.e[coreId] - a.e[coreId]; });
  return out;
}
/* утренний добор: по задаче в каждую сферу, просевшим — вдвое */
function autoBoost() {
  var budget = Math.min(BOOST_LIMIT, PLAN_CAP - state.tasks.length);
  if (budget <= 0) return 0;
  var rank = { crit:0, warn:1, ok:2 };
  var order = analyze().sort(function(a,b){ return rank[a.status] - rank[b.status] || a.v - b.v; });
  var added = {}, total = 0;
  order.forEach(function(x){
    if (budget <= 0) return;
    var picks = pickTasks(x.core.id, Math.min(x.status === "crit" ? 2 : 1, budget), { exclude: added, perCat: 1 });
    picks.forEach(function(p){
      added[p.name] = 1;
      state.tasks.push({ id: nextId(), name: p.name, effects: Object.assign({}, p.e), src:"auto", core: x.core.id });
    });
    if (picks.length) {
      budget -= picks.length; total += picks.length;
      var word = ruWord(picks.length, "задачу", "задачи", "задач");
      pushLog(x.status === "ok"
        ? "Для разнообразия: +" + picks.length + " " + word + " в сферу " + x.core.name + " (" + x.v + "%)"
        : "Реактор добавил " + picks.length + " " + word + ": " + x.core.name +
          (x.status === "crit" ? " просела до " : " на грани — ") + x.v + "%");
    }
  });
  return total;
}
function boostCore(coreId) {
  var core = CORES.find(function(c){ return c.id === coreId; });
  var picks = pickTasks(coreId, 3, { perCat: 1 });
  if (!picks.length) { toast("Все подходящие задачи уже в плане"); return; }
  picks.forEach(function(p){
    state.tasks.push({ id: nextId(), name: p.name, effects: Object.assign({}, p.e), src:"auto", core: coreId });
  });
  pushLog("План усилен по сфере " + core.name + ": +" + picks.length + " " + ruWord(picks.length,"задача","задачи","задач"));
  save(); render();
}
function addPick(bucket, coreId, i) {
  var p = ((ui.picks[bucket] || {})[coreId] || [])[i];
  if (!p) return;
  state.tasks.push({ id: nextId(), name: p.name, effects: Object.assign({}, p.e), src:"auto", core: coreId });
  pushLog("В план: «" + p.name + "»");

}

/* ── ритуалы ── */
function removeRitual(id) {
  var r = state.rituals.find(function(x){ return x.id === id; });
  state.rituals = state.rituals.filter(function(x){ return x.id !== id; });
  if (r) pushLog("Ритуал отключён: «" + r.name + "»");

function toggleRitualDay(id, day) {

/* ── действия ── */
function adjust(id, d) {
  state.batteries[id] = clamp(state.batteries[id] + d);
  var core = CORES.find(function(c){return c.id===id;});
  pushLog(core.name + ": вручную " + fmt(d));
  if (d > 0) ui.bursts[id] = Date.now();
  checkAchs(); save(); render();
}
function addTask() {
  var name = ui.title.trim(); if (!name) return;
  var hasEff = CORES.some(function(c){ return ui.effects[c.id] !== 0; });
  var eff = hasEff ? Object.assign({}, ui.effects) : {energy:10,spirit:0,focus:0};
  if (ui.repeat) {
    var days = ui.days.length ? ui.days.slice() : ALL_DAYS.slice();
    var r = { id: nextId(), name: name, effects: eff, days: days, lastAdded: null };
    state.rituals.push(r);
    var d = today();
    if (days.indexOf(weekdayOf(d)) !== -1) {
      r.lastAdded = d;
      state.tasks.push({ id: nextId(), name: name, effects: Object.assign({}, eff), src:"ritual", ritualId: r.id });
    }
    pushLog("Новый ритуал: «" + name + "» — " + daysLabel(days));
  } else {
    state.tasks.push({ id: nextId(), name: name, effects: eff, src:"manual" });
  }
  ui.title = ""; ui.effects = {energy:0,spirit:0,focus:0}; ui.showForm = false;
  ui.repeat = false; ui.days = ALL_DAYS.slice();
  save(); render();
}
function usePreset(cat, i) {
  var p = PRESET_CATS[cat].items[i];
  ui.title = p.name;
  ui.effects = Object.assign({}, p.e);
  render();
  var inp = document.getElementById("taskTitle");
  if (inp) inp.focus();
}
function setPresetCat(i) { ui.presetCat = i; render(); }
function completeTask(id) {
  var t = state.tasks.find(function(x){return x.id===id;}); if (!t) return;
  CORES.forEach(function(c){ if (t.effects[c.id] > 0) ui.bursts[c.id] = Date.now(); });
  for (var k in t.effects) state.batteries[k] = clamp(state.batteries[k] + t.effects[k]);
  var d = today();
  var combo = state.combo.date === d ? state.combo.count + 1 : 1;
  var mult = 1 + Math.min(combo - 1, 5) * 0.2;
  var absSum = 0; for (var k2 in t.effects) absSum += Math.abs(t.effects[k2]);
  var gained = Math.round((10 + absSum / 5) * mult);
  var prevLvl = Math.floor(state.xp / 100);
  state.xp += gained;
  if (Math.floor(state.xp / 100) > prevLvl) flashLevel();
  if (state.streak.lastDate !== d)
    state.streak = { count: isYesterday(state.streak.lastDate) ? state.streak.count + 1 : 1, lastDate: d };
  state.combo = { count: combo, date: d };
  state.totalDone += 1;
  state.tasks = state.tasks.filter(function(x){return x.id!==id;});
  state.done.unshift({ id:t.id, name:t.name, effects:t.effects, doneAt:d, gained:gained, src:t.src });
  state.done = state.done.slice(0, 120);
  pushLog("«" + t.name + "» → +" + gained + " ✦" + (combo > 1 ? " (комбо ×" + mult.toFixed(1) + ")" : ""));
  checkAchs(); save(); render();
}
function undoTask(id) {
  var t = state.done.find(function(x){return x.id===id;}); if (!t) return;
  for (var k in t.effects) state.batteries[k] = clamp(state.batteries[k] - t.effects[k]);
  state.done = state.done.filter(function(x){return x.id!==id;});
  state.tasks.unshift({ id:t.id, name:t.name, effects:t.effects, src:t.src || "manual" });
  state.xp = Math.max(0, state.xp - (t.gained || 10));
  state.combo.count = Math.max(0, state.combo.count - 1);
  state.totalDone = Math.max(0, state.totalDone - 1);
  pushLog("Возвращено в план: «" + t.name + "»");
  save(); render();
}
function repeatTask(id) {
  var t = state.done.find(function(x){return x.id===id;}); if (!t) return;
  state.tasks.push({ id: nextId(), name: t.name, effects: Object.assign({}, t.effects), src:"manual" });
  pushLog("В план снова: «" + t.name + "»");
  save(); render();
}
function removeTask(id) {
  state.tasks = state.tasks.filter(function(x){return x.id!==id;});
  save(); render();
}
function stepEffect(id, d) {
  ui.effects[id] = Math.max(-25, Math.min(25, ui.effects[id] + d));
  render();
}
function checkAchs() {
  ACHS.forEach(function(a){
    if (state.ach.indexOf(a.id) === -1 && a.test(state)) {

      toast(a.emoji + " Достижение: " + a.name + "!");
    }
  });
}
function flashLevel() {
  var lvl = Math.floor(state.xp / 100) + 1;
  var el = document.createElement("div");
  el.className = "lvlflash";
  el.innerHTML = "УРОВЕНЬ " + lvl + "<br><small>ранг: " + RANKS[Math.min(lvl-1, RANKS.length-1)] + "</small>";
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1700);
}
function toast(text) {
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3100);
}

/* ── резервная копия ── */
function backup() {
  var data = JSON.stringify(state);
  function done(){ toast("💾 Копия скопирована — сохраните её в заметки"); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(done, function(){ window.prompt("Скопируйте текст копии:", data); });
  } else { window.prompt("Скопируйте текст копии:", data); }
}
function restore() {
  var raw = window.prompt("Вставьте текст резервной копии:");
  if (!raw) return;
  try {
    var p = JSON.parse(raw);
    if (!p.batteries) throw new Error("нет данных");
    state = p;
    if (!state.rituals) state.rituals = [];
    if (!state.skipped) state.skipped = [];
    state.rituals.forEach(function(r){ if (!r.days || !r.days.length) r.days = ALL_DAYS.slice(); });
    handleNewDay(); save(); render();
    toast("✓ Данные восстановлены");
  } catch(e) { toast("Не похоже на копию Реактора — проверьте текст"); }
}

/* ── отрисовка ── */

function badgeHTML(t) {

    return '<span class="badge" style="color:'+c.neon+';background:rgba('+c.g+',0.10);border:1px solid rgba('+c.g+',0.3)">'+c.name+' '+fmt(t.effects[c.id])+'</span>';

function srcTagHTML(src) {

function diagHTML() {
  var diag = analyze();
  var weak = diag.filter(function(x){ return x.status !== "ok"; }).slice().sort(function(a,b){ return a.v - b.v; });
  var skip7 = skippedLast(7);
  var h = '<div class="diaghead"><h2>ДИАГНОСТИКА</h2>';
  h += weak.length
    ? '<span class="verdict bad">слабое звено: ' + weak[0].core.name + '</span>'
    : '<span class="verdict good">все три ядра в норме</span>';
  h += '</div>';
  ui.picks.diag = {};
  h += diag.map(function(x){
    var chip = x.status === "crit" ? '<span class="chip crit">ПРОСЕДАЕТ</span>'
             : x.status === "warn" ? '<span class="chip warn">ВНИМАНИЕ</span>'
             : '<span class="chip ok">В НОРМЕ</span>';
    var row = '<div class="diagrow" style="border-left:3px solid '+x.core.neon+'">' +
      '<div class="drtop"><b style="color:'+x.core.neon+'">'+x.core.name+'</b>'+chip+'</div>' +
      '<div class="drwhy">'+x.why+'</div>';
    if (x.status !== "ok") {
      var recs = pickTasks(x.core.id, 3, { perCat: 1 });
      ui.picks.diag[x.core.id] = recs;
      if (recs.length) {
        row += '<div class="recs">' + recs.map(function(p,i){
          return '<button class="preset" onclick="addPick(\'diag\',\''+x.core.id+'\','+i+')">+ '+p.name+' <i>'+fmt(p.e[x.core.id])+'</i></button>';
        }).join('') +
        '<button class="subbtn" onclick="boostCore(\''+x.core.id+'\')">накидать всё</button></div>';
      }
    }
    return row + '</div>';
  }).join('');
  var meta = [];
  if (skip7) meta.push('за 7 дней списано неиспользованными: ' + skip7 + ' ' + ruWord(skip7,"задача","задачи","задач") +
                       (skip7 >= 8 ? ' — план перегружен, ставьте меньше' : ''));
  meta.push('утром в 6:00 МСК реактор подкидывает ритуалы и до ' + BOOST_LIMIT +
            ' задач: по одной в каждую сферу, просевшим — вдвое');
  h += '<div class="diagmeta">' + meta.join('<br>') + '</div>';
  return h;
}
/* подробный разбор недели: что растёт, что проседает, чем добирать каждую сферу */
function weekReportHTML() {
  var d = today();
  var stats = CORES.map(function(c){ return { core:c, s:weekStats(c.id) }; });
  var up = stats.filter(function(x){ return x.s.dir === "up"; }).map(function(x){ return x.core.name; });
  var down = stats.filter(function(x){ return x.s.dir === "down"; }).map(function(x){ return x.core.name; });
  var doneWeek = 0, byDay = {};
  state.done.forEach(function(t){
    if (!t.doneAt) return;
    var diff = daysBetween(t.doneAt, d);
    if (diff < 0 || diff >= 7) return;
    doneWeek++; byDay[t.doneAt] = (byDay[t.doneAt] || 0) + 1;
  });
  var best = null;
  for (var k in byDay) if (!best || byDay[k] > best.n) best = { date:k, n:byDay[k] };
  var skip7 = skippedLast(7);

  var h = '<div class="wsum">';
  if (down.length) h += '<span class="verdict bad">↓ проседает: ' + down.join(", ") + '</span>';
  if (up.length) h += '<span class="verdict good">↑ растёт: ' + up.join(", ") + '</span>';
  if (!down.length && !up.length) h += '<span class="verdict flat">неделя ровная — резких сдвигов нет</span>';
  h += '</div>';
  var line = ['выполнено ' + doneWeek + ' ' + ruWord(doneWeek,"задача","задачи","задач")];
  if (best) line.push('лучший день: ' + best.date + ' — ' + best.n);
  if (skip7) line.push('списано неиспользованными: ' + skip7);
  h += '<div class="diagmeta" style="margin-top:2px">' + line.join(' · ') + '</div>';

  var used = {};
  CORES.forEach(function(c){
    (ui.picks.diag[c.id] || []).forEach(function(p){ used[p.name] = 1; });
  });
  ui.picks.week = {};
  h += stats.map(function(x){
    var s = x.s, c = x.core;
    var arrow = s.dir === "up" ? "↑" : s.dir === "down" ? "↓" : "→";
    var col = s.dir === "up" ? "#3DFFC5" : s.dir === "down" ? "#FF5C7A" : "#7C86AD";
    var picks = pickTasks(c.id, 3, { exclude: used, perCat: 1, seed: 3 });
    picks.forEach(function(p){ used[p.name] = 1; });
    ui.picks.week[c.id] = picks;
    var meta = [];
    meta.push('среднее ' + s.avg + ' · коридор ' + s.min + '–' + s.max);
    meta.push('заряд +' + s.charge + (s.drain ? ' / расход −' + Math.abs(s.drain) : ''));
    meta.push(s.count + ' ' + ruWord(s.count,"заряжающая задача","заряжающие задачи","заряжающих задач"));
    var h2 = '<div class="wrow" style="border-left:3px solid '+c.neon+'">' +
      '<div class="wtop"><b style="color:'+c.neon+'">'+c.name+'</b>' +
        '<span class="wdelta" style="color:'+col+'">'+arrow+' '+(s.delta > 0 ? '+' : s.delta < 0 ? '−' : '')+Math.abs(s.delta)+'</span>' +
        '<span class="wrange">'+s.first+' → '+s.last+'%</span></div>' +
      '<div class="wmeta">'+meta.join(' · ')+'</div>';
    h2 += '<div class="wmeta">' + (s.top
      ? 'лучше всего сработало: <b style="color:#C9D2E8">'+esc(s.top.name)+'</b> (+'+s.top.sum+')'
      : 'за неделю сферу ничем не заряжали') + '</div>';
    if (picks.length) {
      h2 += '<div class="recs"><span class="reclabel">подкинуть:</span>' + picks.map(function(p,i){
        return '<button class="preset" onclick="addPick(\'week\',\''+c.id+'\','+i+')">+ '+p.name+' <i>'+fmt(p.e[c.id])+'</i></button>';
      }).join('') + '</div>';
    }
    return h2 + '</div>';
  }).join('');
  return h;
}

function chartHTML() {
  var pts = state.history.slice(-6).concat([{
    date: today(), energy: state.batteries.energy, spirit: state.batteries.spirit, focus: state.batteries.focus
  }]);
  if (pts.length < 2)
    return '<p class="empty" style="margin:8px 0 0">График недели появится, когда накопится пара дней истории.</p>';
  var W = 520, H = 130, pad = 14;
  function x(i){ return pad + i * ((W - 2*pad) / (pts.length - 1)); }
  function y(v){ return H - pad - (v / 100) * (H - 2*pad); }
  function line(id, color) {
    var d = pts.map(function(p,i){ return (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p[id]).toFixed(1); }).join(' ');
    var dots = pts.map(function(p,i){
      return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p[id]).toFixed(1)+'" r="3" fill="'+color+'"/>';
    }).join('');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px '+color+')"/>' + dots;
  }
  var labels = pts.map(function(p,i){
    var parts = p.date.split(".");
    return '<text x="'+x(i).toFixed(1)+'" y="'+(H-1)+'" font-size="9" fill="#5E6B8C" text-anchor="middle">'+parts[0]+'.'+parts[1]+'</text>';
  }).join('');
  var grid = [25,50,75].map(function(v){
    return '<line x1="'+pad+'" y1="'+y(v)+'" x2="'+(W-pad)+'" y2="'+y(v)+'" stroke="rgba(255,255,255,0.06)"/>';
  }).join('');
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График заряда за неделю">' +
    grid + line("energy","#FFB020") + line("spirit","#3DFFC5") + line("focus","#7C6BFF") + labels +
    '</svg><div class="legend">' +
    '<span style="color:#FFB020">— ЭНЕРГИЯ</span><span style="color:#3DFFC5">— ДУХ</span><span style="color:#7C6BFF">— ФОКУС</span>' +
    '</div></div>';
}
function achsHTML() {
  return '<div class="achs">' + ACHS.map(function(a){
    var on = state.ach.indexOf(a.id) !== -1;

  h += '<div class="footerbtns">' +
    '<button onclick="backup()">💾 Резервная копия</button>' +
    '<button onclick="restore()">↩ Восстановить</button></div>';

  document.getElementById("app").innerHTML = h;
  var inp = document.getElementById("taskTitle");
  if (inp) {
    inp.addEventListener("input", function(){ ui.title = this.value; });
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") submitTask(); });
    if (ui.showForm && ui.focusForm) { inp.focus(); ui.focusForm = false; }
  }
}
function submitTask(){ addTask(); }

/* смена суток в 6:00 МСК — даже если приложение открыто */
function tick() {
  if (today() !== state.lastVisit) {
    handleNewDay(); checkAchs(); render();
    toast("🌅 6:00 — новые сутки реактора");
  }
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) tick(); });

/* звёзды */
(function(){
  var box = document.getElementById("stars");
  var colors = ["#FFB020","#3DFFC5","#7C6BFF"];
  for (var i = 0; i < 24; i++) {
    var s = document.createElement("span");
    s.className = "star";
    s.style.left = (i*41)%100 + "%";
    s.style.top = (i*67)%100 + "%";
    s.style.width = s.style.height = (i%3 ? 2 : 3) + "px";
    s.style.background = colors[i%3];
    s.style.animationDuration = (14 + (i%7)*3) + "s";
    box.appendChild(s);
  }
})();

checkAchs();
render();
</script>
</body>
</html>
