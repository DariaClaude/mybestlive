<!--
══════════════════════════════════════════════════════
  БЛОК 00 — БАЗОВЫЕ СТИЛИ
  Вставить в: Tilda → Настройки сайта → HTML-код в <head>
  Или: Zero Block → JS → в начало, обёрнутый в <style>
══════════════════════════════════════════════════════
-->

<!-- ═══ CSS: ВСТАВИТЬ В <HEAD> TILDA (Настройки → Ещё → HTML-код в <head>) ═══ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:    #10B981;
  --green-lt: #34D399;
  --green-dk: #059669;
  --dark:     #1d1d1f;
  --dark-lt:  #2d2d2f;
  --bg:       #f5f5f7;
  --white:    #ffffff;
  --muted:    #6e6e73;
  --blue:     #0071e3;
}

html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

/* ── KEYFRAMES ── */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes lineReveal {
  from { transform: translateY(110%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes meshPulse {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes floatTag {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-7px); }
}
@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
  50%       { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
}
@keyframes onlinePing {
  0%   { transform: scale(1);   opacity: 1; }
  100% { transform: scale(2.5); opacity: 0; }
}
@keyframes gridShift {
  0%   { background-position: 0 0; }
  100% { background-position: 48px 48px; }
}
@keyframes rippleAnim {
  from { transform: translate(-50%,-50%) scale(0); opacity: 0.4; }
  to   { transform: translate(-50%,-50%) scale(8); opacity: 0; }
}
@keyframes tagAppear {
  from { opacity: 0; transform: translateY(10px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes subIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes lmIn {
  from { opacity:0; transform:translateY(20px) scale(.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* ── SCROLL REVEAL ── */
.reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.65s cubic-bezier(0.16,1,0.3,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1 { transition-delay: 0.08s; }
.reveal-delay-2 { transition-delay: 0.16s; }
.reveal-delay-3 { transition-delay: 0.24s; }
.reveal-delay-4 { transition-delay: 0.32s; }
.reveal-delay-5 { transition-delay: 0.40s; }

/* ── RIPPLE ── */
.ripple-fx { position: absolute; border-radius: 50%; width: 10px; height: 10px; background: rgba(255,255,255,0.4); animation: rippleAnim 0.6s linear; pointer-events: none; }

/* ── SECTION LABELS (общие) ── */
.section-label {
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  font-weight: 600; color: var(--muted); margin-bottom: 8px;
}
.section-title {
  font-size: clamp(22px, 3vw, 32px); font-weight: 800;
  letter-spacing: -1px; color: var(--dark); margin-bottom: 20px;
}
</style>
