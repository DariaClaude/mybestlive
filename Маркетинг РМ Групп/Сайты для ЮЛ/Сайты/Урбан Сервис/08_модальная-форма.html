<!--
══════════════════════════════════════════════════════
  БЛОК 08 — МОДАЛЬНАЯ ФОРМА ЗАЯВКИ
  Вставить ОДИН РАЗ на всю страницу (в любой Zero Block в конце)
  Срабатывает на клик по любой CTA-кнопке
══════════════════════════════════════════════════════
-->

<!-- ═══ CSS ═══ -->
<style>
#lm-overlay {
  display: none; position: fixed; inset: 0; z-index: 99999;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 16px;
}
#lm-overlay.lm-open { display: flex !important; }

#lm-box {
  background: #fff; border-radius: 24px; padding: 40px 36px 32px;
  max-width: 460px; width: 100%; position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,0.22);
  animation: lmIn .35s cubic-bezier(.16,1,.3,1);
}

#lm-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: #aaa; line-height: 1; padding: 4px 8px;
}

#lm-site-label {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  font-weight: 700; color: #888; margin-bottom: 6px;
}

#lm-box h2 {
  font-size: 22px; font-weight: 800; letter-spacing: -.5px;
  margin-bottom: 4px; color: #1d1d1f;
}

#lm-box p.lm-sub {
  font-size: 13px; color: #888; margin-bottom: 22px;
}

.lm-input {
  display: block; width: 100%; margin-bottom: 10px;
  padding: 11px 14px; border: 1.5px solid #e5e5e5; border-radius: 10px;
  font-size: 14px; font-family: 'Inter', sans-serif; outline: none;
  box-sizing: border-box; transition: border-color .2s;
}
.lm-input:focus { border-color: #10b981; }

.lm-textarea {
  display: block; width: 100%; margin-bottom: 18px;
  padding: 11px 14px; border: 1.5px solid #e5e5e5; border-radius: 10px;
  font-size: 14px; font-family: 'Inter', sans-serif; outline: none;
  resize: none; box-sizing: border-box; transition: border-color .2s;
}
.lm-textarea:focus { border-color: #10b981; }

#lm-submit {
  width: 100%; padding: 13px; background: #1d1d1f; color: #fff;
  border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: 'Inter', sans-serif; transition: background .2s;
}
#lm-submit:hover { background: #2d2d2f; }

.lm-privacy {
  font-size: 11px; color: #bbb; margin-top: 10px; text-align: center;
}

#lm-success {
  display: none; text-align: center; padding: 24px 0;
}
.lm-success-icon {
  width: 64px; height: 64px; background: #f0fdf4; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 28px; color: #10b981;
}
#lm-success h3 {
  font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #1d1d1f;
}
#lm-success p {
  color: #888; font-size: 14px; line-height: 1.6;
}
</style>

<!-- ═══ HTML ═══ -->
<div id="lm-overlay">
  <div id="lm-box">
    <button id="lm-close">✕</button>

    <!-- Форма -->
    <div id="lm-form-wrap">
      <p id="lm-site-label"></p>
      <h2>Оставить заявку</h2>
      <p class="lm-sub">Ответим в течение рабочего дня</p>
      <form id="lm-form" novalidate>
        <input type="text"  name="name"    placeholder="Имя *"      required class="lm-input"/>
        <input type="tel"   name="phone"   placeholder="Телефон *"  required class="lm-input"/>
        <input type="email" name="email"   placeholder="Email"               class="lm-input"/>
        <textarea           name="comment" placeholder="Комментарий" rows="3" class="lm-textarea"></textarea>
        <button type="submit" id="lm-submit">Отправить заявку</button>
        <p class="lm-privacy">Нажимая кнопку, вы соглашаетесь с обработкой персональных данных</p>
      </form>
    </div>

    <!-- Успех -->
    <div id="lm-success">
      <div class="lm-success-icon">✓</div>
      <h3>Заявка отправлена!</h3>
      <p>Мы свяжемся с вами<br>в течение рабочего дня</p>
    </div>
  </div>
</div>

<!-- ═══ JS ═══ -->
<script>
(function(){
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgL5kKDfYviyqbif6DmMvJDI0O_nFK7BwGzRr76SjEuiSDPow0NVCyA7w1AFCiZNbR/exec';
  var siteName   = (document.title.split('—')[0] || document.title.split('–')[0] || document.title).trim();

  var overlay   = document.getElementById('lm-overlay');
  var closeBtn  = document.getElementById('lm-close');
  var form      = document.getElementById('lm-form');
  var submitBtn = document.getElementById('lm-submit');
  var successDiv= document.getElementById('lm-success');
  var formWrap  = document.getElementById('lm-form-wrap');
  var siteLabel = document.getElementById('lm-site-label');

  siteLabel.textContent = siteName;

  function openModal()  { overlay.classList.add('lm-open'); document.body.style.overflow = 'hidden'; }
  function closeModal() { overlay.classList.remove('lm-open'); document.body.style.overflow = ''; }

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

  /* Перехват всех CTA-кнопок */
  var CTA_SEL = [
    'a[href="#contacts"]', 'a[href^="mailto:"]',
    '.nav-cta', '.btn-bento', '.btn-bento-ghost',
    '.c-cta-btn', '.btn-primary', '.btn-cta'
  ].join(',');

  document.addEventListener('click', function(e) {
    var el = e.target.closest(CTA_SEL);
    if (el) { e.preventDefault(); openModal(); }
  });

  /* Отправка формы */
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var name  = form.querySelector('[name=name]').value.trim();
    var phone = form.querySelector('[name=phone]').value.trim();
    if (!name || !phone) { alert('Пожалуйста, заполните Имя и Телефон'); return; }

    submitBtn.textContent = 'Отправляем…';
    submitBtn.disabled = true;

    var params = new URLSearchParams({
      site:    siteName,
      name:    name,
      phone:   phone,
      email:   form.querySelector('[name=email]').value.trim(),
      comment: form.querySelector('[name=comment]').value.trim()
    });

    fetch(SCRIPT_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' })
      .then(function() {
        formWrap.style.display = 'none';
        successDiv.style.display = 'block';
        setTimeout(function() {
          closeModal();
          setTimeout(function() {
            formWrap.style.display = '';
            successDiv.style.display = 'none';
            submitBtn.textContent = 'Отправить заявку';
            submitBtn.disabled = false;
            form.reset();
          }, 400);
        }, 3000);
      })
      .catch(function() {
        submitBtn.textContent = 'Ошибка, попробуйте ещё раз';
        submitBtn.disabled = false;
      });
  });
})();
</script>
