<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@400&amp;display=swap');
      .logo-name { font-family: 'Playfair Display', Georgia, serif; font-size: 15px; font-weight: 700; fill: #0B2545; }
      .logo-sub  { font-family: 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #6b7280; }
    </style>
  </defs>

  <!-- Icon mark (36x36, centered at 0,6) -->
  <g transform="translate(0, 6)">
    <!-- Left team member -->
    <circle cx="8"  cy="15" r="5.5" stroke="#C9A84C" stroke-width="1.7" stroke-opacity="0.6" fill="none"/>
    <!-- Center — Pro (larger, elevated) -->
    <circle cx="18" cy="11" r="7"   fill="rgba(201,168,76,0.1)" stroke="#C9A84C" stroke-width="1.9"/>
    <!-- Right team member -->
    <circle cx="28" cy="15" r="5.5" stroke="#C9A84C" stroke-width="1.7" stroke-opacity="0.6" fill="none"/>
    <!-- Horizontal connector -->
    <line x1="8" y1="20.5" x2="28" y2="20.5" stroke="#C9A84C" stroke-width="1.3" stroke-opacity="0.35" stroke-linecap="round"/>
    <!-- Vertical stem -->
    <line x1="18" y1="20.5" x2="18" y2="31" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Divider gap -->
  <!-- Logo name -->
  <text x="48" y="28" class="logo-name">Тим Про</text>

  <!-- Vertical divider -->
  <line x1="114" y1="14" x2="114" y2="34" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Subtext -->
  <text x="122" y="24" class="logo-sub">Аутсорсинг</text>
  <text x="122" y="37" class="logo-sub">персонала</text>
</svg>
