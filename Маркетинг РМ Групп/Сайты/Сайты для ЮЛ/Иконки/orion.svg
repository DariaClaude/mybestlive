<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Orion belt — 3 dots -->
  <circle cx="176" cy="256" r="22" fill="url(#star)" opacity="0.9"/>
  <circle cx="256" cy="256" r="28" fill="url(#star)"/>
  <circle cx="336" cy="256" r="22" fill="url(#star)" opacity="0.9"/>
  <!-- shoulders -->
  <circle cx="140" cy="172" r="14" fill="#60A5FA" opacity="0.5"/>
  <circle cx="372" cy="172" r="14" fill="#A78BFA" opacity="0.5"/>
  <!-- feet -->
  <circle cx="160" cy="342" r="12" fill="#60A5FA" opacity="0.35"/>
  <circle cx="354" cy="342" r="12" fill="#A78BFA" opacity="0.35"/>
  <!-- connecting lines -->
  <line x1="140" y1="172" x2="176" y2="256" stroke="rgba(96,165,250,0.2)" stroke-width="2"/>
  <line x1="372" y1="172" x2="336" y2="256" stroke="rgba(167,139,250,0.2)" stroke-width="2"/>
  <line x1="176" y1="256" x2="160" y2="342" stroke="rgba(96,165,250,0.2)" stroke-width="2"/>
  <line x1="336" y1="256" x2="354" y2="342" stroke="rgba(167,139,250,0.2)" stroke-width="2"/>
  <rect x="96" y="400" width="320" height="3" rx="1.5" fill="url(#star)" opacity="0.3"/>
</svg>
