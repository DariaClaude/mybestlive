  {xp:0,    name:"Руководитель отдела"},
  {xp:250,  name:"Head of Marketing"},
  {xp:700,  name:"Директор по маркетингу"},
  {xp:1500, name:"CMO"},
  {xp:2600, name:"CMO уровня совета"}
];
var DEFAULT_REWARDS = [
  {id:1, name:"Час на себя без чувства вины", cost:60},
  {id:2, name:"Книга по подписке или на бумаге", cost:120},
  {id:3, name:"Профессиональная конференция", cost:400},
  {id:4, name:"Спа или массаж", cost:250},
  {id:5, name:"Выходной без единого рабочего чата", cost:600}
];

/* ─────────── СОСТОЯНИЕ ─────────── */
function today(){ return new Date().toLocaleDateString("ru-RU"); }
function parseD(s){ var p = (s||"").split("."); return p.length===3 ? new Date(+p[2], +p[1]-1, +p[0]) : null; }
function daysBetween(a, b){ var x = parseD(a), y = parseD(b); return (!x||!y) ? 0 : Math.round((y-x)/86400000); }
function defState(){
  return { v:1, scores:null, quizAt:null, quizHistory:[], answers:[], qi:0,
           xp:0, spent:0, streak:{count:0, last:null},
           day:{date:null, cards:[], applied:[]},
           practice:{}, badges:[], log:[], bossAt:null, bossLog:[], seen:[],
           rewards:DEFAULT_REWARDS.slice(), bought:[] };
}
function load(){
  try {
    var raw = localStorage.getItem(LSKEY);
    if (!raw) return defState();
    var s = JSON.parse(raw), d = defState();
    for (var k in d) if (!(k in s)) s[k] = d[k];
    return s;
  } catch(e){ return defState(); }
}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch(e){} }
var state = load();
var ui = { tab:"today", card:null, bossOpen:false, bossText:"", showRef:false, addReward:false,
           started:false, retake:false, result:false };

/* ─────────── ПРОГРЕСС И УРОВНИ ─────────── */
function balance(){ return state.xp - state.spent; }
function levelIdx(){ var i = 0; LEVELS.forEach(function(l, n){ if (state.xp >= l.xp) i = n; }); return i; }
function nextLevel(){ return LEVELS[levelIdx()+1] || null; }
function addXP(n, why){
  state.xp += n;
  var before = levelIdx();
  pushLog("+" + n + " XP · " + why);
  if (levelIdx() > before) toast("Новый уровень: " + LEVELS[levelIdx()].name);
}
function pushLog(t){ state.log.unshift({ d:today(), t:t }); state.log = state.log.slice(0, 60); }

/* оценка компетенции = ассессмент + практика (0.1 за применённое действие, максимум +1.5) */
function scoreOf(id){
  if (!state.scores) return 0;
  var grow = Math.min((state.practice[id] || 0) * 0.1, 1.5);
  return Math.min(5, state.scores[id] + grow);
}
function growthOf(id){ return Math.min((state.practice[id] || 0) * 0.1, 1.5); }
function weakest(){
  return COMPS.slice().sort(function(a, b){ return scoreOf(a.id) - scoreOf(b.id); });
}

/* ─────────── АССЕССМЕНТ ─────────── */
function answer(points){
  state.answers.push(points);
  state.qi++;
  if (state.qi >= QUIZ.length) finishQuiz(); else save();
  render();
}
function finishQuiz(){
  var sum = {}, cnt = {};
  QUIZ.forEach(function(q, i){
    sum[q.c] = (sum[q.c] || 0) + (state.answers[i] || 0);
    cnt[q.c] = (cnt[q.c] || 0) + 1;
  });
  var sc = {};
  COMPS.forEach(function(c){ sc[c.id] = Math.round((sum[c.id] / cnt[c.id]) * 10) / 10; });
  if (state.scores) state.quizHistory.push({ d:state.quizAt, scores:state.scores });
  state.scores = sc; state.quizAt = today(); state.answers = []; state.qi = 0;
  ui.started = false; ui.retake = false; ui.result = true;
  addXP(50, "срез компетенций пройден");
  giveBadge("start", "Точка отсчёта");
  if (state.quizHistory.length) giveBadge("remeasure", "Замер прогресса");
  save();
}
function restartQuiz(){
  if (!confirm("Пройти срез заново? Текущие оценки уйдут в историю, рост от практики обнулится.")) return;
  state.answers = []; state.qi = 0; state.practice = {}; ui.retake = true;
  save(); render();
}

/* ─────────── ДЕНЬ ─────────── */
function newDayIfNeeded(){
  if (state.day.date === today()) return;
  if (state.streak.last) {
    var gap = daysBetween(state.streak.last, today());
    if (gap > 1) { if (state.streak.count > 1) pushLog("Серия прервана: " + state.streak.count + " дн."); state.streak.count = 0; }
  }
  state.day = { date:today(), cards:[], applied:[] };
  save();
}
function pickCard(){
  var order = weakest();
  var usedToday = state.day.cards.map(function(t){
    var c = CARDS.find(function(x){ return x.t === t; }); return c ? c.c : "";
  });
  function fromComp(id){
    return CARDS.filter(function(c){
      return c.c === id && state.seen.indexOf(c.t) < 0 && state.day.cards.indexOf(c.t) < 0;
    })[0];
  }
  for (var i = 0; i < order.length; i++)             /* сначала слабая зона, которой сегодня ещё не было */
    if (usedToday.indexOf(order[i].id) < 0) { var c1 = fromComp(order[i].id); if (c1) return c1; }
  for (var j = 0; j < order.length; j++) { var c2 = fromComp(order[j].id); if (c2) return c2; }
  var rest = CARDS.filter(function(c){ return state.day.cards.indexOf(c.t) < 0; });
  if (!rest.length) return null;
  state.seen = [];                                   /* круг пройден — начинаем заново */
  return rest[0];
}
function takeCard(){
  if (state.day.cards.length >= 3) { toast("Дневная норма закрыта"); return; }
  var c = pickCard();
  if (!c) { toast("Карточки на сегодня кончились"); return; }
  state.day.cards.push(c.t);
  state.seen.push(c.t);
  addXP(10, "карточка: " + c.t);
  if (state.streak.last !== today()) {
    state.streak.count++; state.streak.last = today();
    if (state.streak.count % 7 === 0) addXP(50, "серия " + state.streak.count + " дней");
    if (state.streak.count >= 7) giveBadge("w7", "Неделя без пропуска");
    if (state.streak.count >= 30) giveBadge("w30", "Месяц дисциплины");
  }
  save(); render();
}
function markApplied(title){
  if (state.day.applied.indexOf(title) >= 0) return;
  var card = CARDS.find(function(c){ return c.t === title; });
  state.day.applied.push(title);
  state.practice[card.c] = (state.practice[card.c] || 0) + 1;
  addXP(25, "действие применено: " + title);
  if (state.practice[card.c] >= 5) giveBadge("p_" + card.c, "Практик: " + comp(card.c).name);
  if (state.practice[card.c] >= 15) giveBadge("m_" + card.c, "Мастер: " + comp(card.c).name);
  save(); render();
  toast("+25 XP · " + comp(card.c).name);
}
function giveBadge(id, name){
  if (state.badges.some(function(b){ return b.id === id; })) return;
  state.badges.push({ id:id, name:name, d:today() });
  toast("Бейдж: " + name);
}

/* ─────────── БОСС-КЕЙС ─────────── */
function bossDue(){
  if (!state.scores) return false;
  if (!state.bossAt) return true;
  return daysBetween(state.bossAt, today()) >= 14;
}
function currentBoss(){
  var used = state.bossLog.map(function(b){ return b.t; });
  var weak = weakest();
  for (var i = 0; i < weak.length; i++) {
    var b = BOSS.find(function(x){ return x.c === weak[i].id && used.indexOf(x.t) < 0; });
    if (b) return b;
  }
  return BOSS[0];
}
function submitBoss(){
  var b = currentBoss();
  var txt = document.getElementById("bossText") ? document.getElementById("bossText").value : "";
  if (txt.trim().length < 40) { toast("Напишите развёрнутый ответ"); return; }
  ui.bossText = txt; ui.showRef = true;
  render();
}
function closeBoss(selfScore){
  var b = currentBoss();
  state.bossLog.unshift({ t:b.t, c:b.c, d:today(), text:ui.bossText, score:selfScore });
  state.bossAt = today();
  state.practice[b.c] = (state.practice[b.c] || 0) + (selfScore >= 4 ? 3 : 1);
  addXP(60, "босс-кейс: " + b.t);
  giveBadge("boss1", "Первый босс-кейс");
  if (state.bossLog.length >= 5) giveBadge("boss5", "Пять босс-кейсов");
  ui.bossOpen = false; ui.showRef = false; ui.bossText = "";
  save(); render();
}

/* ─────────── НАГРАДЫ ─────────── */
function buy(id){
  var r = state.rewards.find(function(x){ return x.id === id; });
  if (!r || balance() < r.cost) return;
  if (!confirm("Забрать награду «" + r.name + "» за " + r.cost + " XP?")) return;
  state.spent += r.cost;
  state.bought.unshift({ name:r.name, cost:r.cost, d:today() });
  pushLog("Награда получена: " + r.name);
  save(); render();
  toast("Заслужено. Заберите награду сегодня");
}
function addReward(){
  var n = document.getElementById("rwName").value.trim();
  var c = parseInt(document.getElementById("rwCost").value, 10);
  if (!n || !c || c < 1) { toast("Название и цена"); return; }
  state.rewards.push({ id:Date.now(), name:n, cost:c });
  ui.addReward = false; save(); render();
}
function delReward(id){
  state.rewards = state.rewards.filter(function(r){ return r.id !== id; });
  save(); render();
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(t){
  var d = document.createElement("div");
  d.className = "toast"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
}

/* восхождение по уровням — пять ступеней, пройденные золотом */
function stairs(){
  var idx = levelIdx(), hs = [20, 34, 48, 62, 76], h = '<div class="stairs">';
  LEVELS.forEach(function(l, i){
    h += '<div class="' + (i < idx ? "on" : i === idx ? "cur" : "") + '" style="height:' + hs[i] + 'px"></div>';
  });
  return h + '</div>';
}

function radar(){
  var cx = 148, cy = 146, R = 116, n = COMPS.length, out = "";
  for (var g = 1; g <= 5; g++) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = -Math.PI/2 + i * 2*Math.PI/n, r = R * g/5;
      pts.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
    }
    out += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="' + (g === 4 ? "#0E0E0E" : "#E4E1DA") +
           '" stroke-width="1"' + (g === 4 ? ' stroke-dasharray="2 5"' : '') + '/>';
  }
  var p = [], marks = "";
  for (var i = 0; i < n; i++) {
    var a = -Math.PI/2 + i * 2*Math.PI/n, sc = scoreOf(COMPS[i].id), r = R * sc/5;
    var x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    p.push(x.toFixed(1) + "," + y.toFixed(1));
    out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R*Math.cos(a)).toFixed(1) + '" y2="' +
           (cy + R*Math.sin(a)).toFixed(1) + '" stroke="#EFEDE7" stroke-width="1"/>';
    marks += '<rect x="' + (x-3).toFixed(1) + '" y="' + (y-3).toFixed(1) + '" width="6" height="6" fill="#0E0E0E"/>';
    var lr = R + 22, lx = cx + lr*Math.cos(a), ly = cy + lr*Math.sin(a);
    var anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    marks += '<text x="' + lx.toFixed(0) + '" y="' + (ly - 1).toFixed(0) + '" text-anchor="' + anchor +
             '" font-size="9" letter-spacing="1.6" font-weight="700" fill="#8A8A8A">' +
             COMPS[i].name.split(" ")[0].toUpperCase() + '</text>' +
             '<text x="' + lx.toFixed(0) + '" y="' + (ly + 15).toFixed(0) + '" text-anchor="' + anchor +
             '" font-size="15" font-weight="700" letter-spacing="-0.5" fill="#0E0E0E">' + sc.toFixed(1) + '</text>';
  }
  out += '<polygon points="' + p.join(" ") + '" fill="rgba(212,175,55,.30)" stroke="#B8912F" stroke-width="2.5"/>' + marks;
  return '<svg viewBox="-56 -14 408 326" style="width:100%;display:block;margin:4px auto 0">' + out + '</svg>';
}

function header(){
  var l = LEVELS[levelIdx()], nx = nextLevel();
  var pct = nx ? Math.max(0, Math.min(100, Math.round((state.xp - l.xp) / (nx.xp - l.xp) * 100))) : 100;
  return '<div class="eyebrow">Путь к директору по маркетингу</div>' +
    '<div class="logo">ВЕКТОР' + ARROW + '</div><div class="rule"></div>' +
    '<div style="padding-top:20px">' +
      '<div class="eyebrow">Ступень ' + (levelIdx()+1) + ' из ' + LEVELS.length + '</div>' +
      '<div class="mid" style="margin-top:7px">' + l.name + '</div>' + stairs() +
      '<div class="row" style="align-items:flex-end">' +
        '<div><div class="big">' + state.xp + '</div><div class="eyebrow" style="margin-top:6px">XP всего</div></div>' +
        '<div class="small muted" style="text-align:right;max-width:52%">' +
          (nx ? 'До «' + nx.name + '»<br/><b class="gold" style="font-size:15px">' + (nx.xp - state.xp) + ' XP</b>' : 'Вершина шкалы') +
        '</div></div>' +
      '<div class="bar" style="margin-top:14px"><i style="width:' + pct + '%"></i></div>' +
      '<div class="row small muted" style="margin-top:12px">' +
        '<span>Серия ' + state.streak.count + ' дн.</span><span>На награды ' + balance() + ' XP</span></div>' +
    '</div>';
}

function screenIntro(){
  return '<div class="eyebrow">Путь к директору по маркетингу</div>' +
    '<div class="logo huge">ВЕКТОР' + ARROW + '</div>' +
    '<div class="rule"></div>' +
    '<div style="padding-top:22px"><div class="mid">40 ситуаций.<br/>8 компетенций.<br/>15 минут.</div>' +
    '<p class="body muted" style="margin:18px 0 0">Без самооценки: только выбор действия. На выходе — карта сильных и провальных зон и три приоритета на квартал.</p>' +
    '<button class="primary wide" onclick="ui.started=true;state.qi=0;state.answers=[];save();render()">Начать срез</button></div>' +
    '<div class="sec"><h2>Как устроено</h2>' +
    '<div class="kv"><span>Каждый день</span><span>3 карточки по слабым зонам</span></div>' +
    '<div class="kv"><span>XP начисляется</span><span>за применение, не за чтение</span></div>' +
    '<div class="kv"><span>Раз в две недели</span><span>босс-кейс без вариантов ответа</span></div>' +
    '<div class="kv"><span>Награды</span><span>покупаете за накопленные XP</span></div></div>';
}

function screenQuiz(){
  var q = QUIZ[state.qi], c = comp(q.c);
  var pct = Math.round(state.qi / QUIZ.length * 100);
  var h = '<div class="eyebrow">Срез компетенций</div>' +
    '<div class="logo">ВЕКТОР' + ARROW + '</div><div class="rule"></div>' +
    '<div class="fade" style="padding-top:20px">' +
    '<div class="row" style="align-items:flex-end">' +
      '<div class="qnum">' + (state.qi < 9 ? "0" : "") + (state.qi+1) + '</div>' +
      '<div style="text-align:right"><div class="tag">' + c.name + '</div>' +
      '<div class="small muted" style="margin-top:4px">из ' + QUIZ.length + '</div></div></div>' +
    '<div class="bar" style="margin-top:14px"><i style="width:' + pct + '%"></i></div>' +
    '<div class="qtext">' + esc(q.q) + '</div>';
  q.o.forEach(function(o, i){
    h += '<button class="opt" onclick="answer(' + o[1] + ')"><b>' + "АБВГ".charAt(i) + '</b><span>' + esc(o[0]) + '</span></button>';
  });
  h += '<div class="small muted" style="margin-top:16px">Отвечайте как поступаете сейчас, а не как правильно. Смысл среза — найти провалы.</div></div>';
  return h;
}

function tabToday(){
  var h = header();
  if (bossDue() && !ui.bossOpen) {
    h += '<div class="sec top"><div class="row"><h2 style="margin:0">Босс-кейс</h2><span class="tag">+60 XP</span></div>' +
         '<div class="mid" style="margin-top:14px">' + esc(currentBoss().t) + '</div>' +
         '<p class="body muted" style="margin:12px 0 0">Развёрнутая ситуация без вариантов ответа. Пишете решение, потом сверяете с эталоном.</p>' +
         '<button class="dark wide" onclick="ui.bossOpen=true;render()">Открыть кейс</button></div>';
  }
  if (ui.bossOpen) return h + bossBlock();

  var w = weakest()[0];
  h += '<div class="sec top"><div class="row" style="align-items:flex-start">' +
       '<div><div class="eyebrow">Фокус дня</div><div class="mid" style="margin-top:8px">' + w.full + '</div></div>' +
       '<div class="num gold" style="text-align:right">' + scoreOf(w.id).toFixed(1) + '</div></div>' +
       '<div class="small muted" style="margin-top:12px">Сегодня взято ' + state.day.cards.length + ' из 3 карточек.</div></div>';

  state.day.cards.forEach(function(t){
    var c = CARDS.find(function(x){ return x.t === t; }), k = comp(c.c), done = state.day.applied.indexOf(t) >= 0;
    h += '<div class="sec fade"><span class="tag">' + k.name + '</span>' +
         '<h3 class="cardTitle">' + esc(c.t) + '</h3>' +
         '<p class="body">' + esc(c.b) + '</p>' +
         '<div class="act"><div class="eyebrow gold">Действие на сегодня</div>' +
         '<div style="margin-top:8px;font-size:16px;line-height:1.45">' + esc(c.a) + '</div></div>' +
         (done ? '<div class="row" style="margin-top:18px"><span class="tag">✓ Применено</span>' +
                 '<span class="small muted">+25 XP · ' + k.name + '</span></div>'
               : '<button class="primary wide" onclick="markApplied(\'' + esc(c.t).replace(/'/g,"\\'") + '\')">Применила в работе · +25 XP</button>') +
         '</div>';
  });

  if (state.day.cards.length < 3)
    h += '<button class="dark wide" onclick="takeCard()" style="margin-top:22px">' +
         (state.day.cards.length ? "Ещё карточка" : "Карточка дня · +10 XP") + '</button>';
  else
    h += '<div class="sec"><div class="mid">Дневная норма закрыта.</div>' +
         '<p class="body muted" style="margin:10px 0 0">Возвращайтесь завтра — план соберётся по новым слабым зонам.</p></div>';
  return h;
}

function bossBlock(){
  var b = currentBoss(), c = comp(b.c);
  var h = '<div class="sec top"><span class="tag">' + c.name + '</span>' +
    '<h3 class="cardTitle">' + esc(b.t) + '</h3>' +
    '<p class="body">' + esc(b.s) + '</p>';
  if (!ui.showRef) {
    h += '<div class="eyebrow" style="margin-top:22px">Ваш разбор</div>' +
      '<textarea id="bossText" placeholder="Решение, на что опираетесь, что говорите совету">' + esc(ui.bossText) + '</textarea>' +
      '<button class="primary wide" onclick="submitBoss()">Сверить с эталоном</button>' +
      '<button class="ghost wide" onclick="ui.bossOpen=false;render()">Позже</button></div>';
    return h;
  }
  h += '<div class="act" style="margin-top:22px"><div class="eyebrow gold">Ваш ответ</div>' +
       '<div class="small" style="margin-top:8px">' + esc(ui.bossText).replace(/\n/g, "<br/>") + '</div></div>';
  h += '<div class="eyebrow" style="margin:26px 0 12px">Эталон: что должно прозвучать</div><ul class="ref">';
  b.ref.forEach(function(r){ h += '<li>' + esc(r) + '</li>'; });
  h += '</ul><div class="eyebrow" style="margin:26px 0 12px">Сколько пунктов вы назвали?</div><div class="row" style="gap:6px">';
  [1,2,3,4,5].forEach(function(n){ h += '<button style="flex:1;padding:15px 0" onclick="closeBoss(' + n + ')">' + n + '</button>'; });
  h += '</div></div>';
  return h;
}

function tabMap(){
  var weak3 = weakest().slice(0, 3).map(function(c){ return c.id; });
  var h = header() + '<div class="sec top"><h2>Карта компетенций</h2>' + radar() +
    '<div class="small muted" style="text-align:center;margin-top:10px">Пунктир — планка директора по маркетингу: 4 из 5</div></div>';
  h += '<div class="sec"><h2>Приоритеты квартала</h2>';
  weakest().slice(0, 3).forEach(function(c, i){
    h += '<div class="row" style="padding:16px 0;border-bottom:1px solid #E4E1DA;align-items:flex-start">' +
         '<div style="display:flex;gap:16px"><span class="num gold">' + (i+1) + '</span>' +
         '<span style="font-size:17px;font-weight:700;letter-spacing:-.02em;padding-top:8px">' + c.full + '</span></div>' +
         '<span class="mid">' + scoreOf(c.id).toFixed(1) + '</span></div>';
  });
  h += '<div class="small muted" style="margin-top:14px">Карточки дня приходят по этим зонам, пока они не подтянутся.</div></div>';
  h += '<div class="sec"><h2>Все компетенции</h2>';
  COMPS.forEach(function(c){
    var s = scoreOf(c.id), g = growthOf(c.id), hot = weak3.indexOf(c.id) >= 0;
    h += '<div style="margin-bottom:16px"><div class="row small" style="margin-bottom:7px">' +
      '<span style="font-size:14px">' + c.full + '</span>' +
      '<span style="font-weight:700">' + s.toFixed(1) + (g > 0 ? ' <span class="gold">+' + g.toFixed(1) + '</span>' : '') + '</span></div>' +
      '<div class="bar"><i style="width:' + (s/5*100) + '%;background:' + (hot ? "#D4AF37" : "#0E0E0E") + '"></i></div></div>';
  });
  h += '<div class="hair"></div><div class="small muted">Срез пройден: ' + (state.quizAt || "—") +
       '. Рост от практики: +0,1 за применённое действие, максимум +1,5 до следующего среза.</div>' +
       '<button class="dark wide" onclick="ui.result=true;render()">Открыть заключение</button>' +
       '<button class="ghost wide" onclick="restartQuiz()">Пройти срез заново</button></div>';
  if (state.quizHistory.length) {
    h += '<div class="sec"><h2>История срезов</h2>';
    state.quizHistory.slice().reverse().forEach(function(q){
      var avg = COMPS.reduce(function(a, c){ return a + q.scores[c.id]; }, 0) / COMPS.length;
      h += '<div class="kv"><span class="muted">' + q.d + '</span><span style="font-weight:700">' + avg.toFixed(1) + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function tabRewards(){
  var h = header() + '<div class="sec top"><div class="row"><h2 style="margin:0">Магазин наград</h2>' +
    '<span class="mid gold">' + balance() + '</span></div>' +
    '<div class="small muted" style="margin:14px 0 20px">XP тратится здесь, но уровень не падает. Награда должна быть настоящей — иначе механика не работает.</div>';
  state.rewards.forEach(function(r){
    var can = balance() >= r.cost;
    h += '<div class="row" style="padding:16px 0;border-bottom:1px solid #E4E1DA">' +
      '<span style="flex:1"><span style="font-size:16px">' + esc(r.name) + '</span><br/>' +
      '<span class="tag" style="color:' + (can ? "#8C6D1F" : "#A0A0A0") + '">' + r.cost + ' XP</span></span>' +
      '<span style="display:flex;gap:6px">' +
      '<button ' + (can ? 'class="primary" ' : 'disabled ') + 'style="padding:11px 14px" onclick="buy(' + r.id + ')">' +
      (can ? "Забрать" : "Копим") + '</button>' +
      '<button class="ghost" style="padding:11px 13px" onclick="delReward(' + r.id + ')">✕</button></span></div>';
  });
  if (ui.addReward) {
    h += '<div style="margin-top:18px"><input type="text" id="rwName" placeholder="Название награды"/>' +
      '<input type="number" id="rwCost" placeholder="Цена в XP" style="margin-top:8px"/>' +
      '<button class="primary wide" onclick="addReward()">Добавить</button></div>';
  } else {
    h += '<button class="ghost wide" onclick="ui.addReward=true;render()">+ Своя награда</button>';
  }
  h += '</div>';
  if (state.bought.length) {
    h += '<div class="sec"><h2>Получено</h2>';
    state.bought.slice(0, 10).forEach(function(b){
      h += '<div class="kv"><span>' + esc(b.name) + '</span><span class="muted small">' + b.d + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function tabProgress(){
  var h = header();
  var appliedTotal = Object.keys(state.practice).reduce(function(a, k){ return a + state.practice[k]; }, 0);
  h += '<div class="sec top"><h2>Итоги</h2><div class="row" style="align-items:flex-start;gap:10px">' +
    '<div class="stat"><div class="n">' + appliedTotal + '</div><div class="l">Действий</div></div>' +
    '<div class="stat"><div class="n">' + state.bossLog.length + '</div><div class="l">Кейсов</div></div>' +
    '<div class="stat"><div class="n">' + state.streak.count + '</div><div class="l">Серия</div></div>' +
    '<div class="stat"><div class="n">' + state.xp + '</div><div class="l">Всего XP</div></div></div></div>';
  h += '<div class="sec"><h2>Бейджи</h2>';
  var all = [{id:"start",name:"Точка отсчёта"},{id:"w7",name:"Неделя без пропуска"},{id:"w30",name:"Месяц дисциплины"},
             {id:"boss1",name:"Первый босс-кейс"},{id:"boss5",name:"Пять босс-кейсов"},{id:"remeasure",name:"Замер прогресса"}];
  COMPS.forEach(function(c){ all.push({id:"p_" + c.id, name:"Практик: " + c.name}); });
  all.forEach(function(b){
    var has = state.badges.some(function(x){ return x.id === b.id; });
    h += '<span class="badge ' + (has ? 'on' : '') + '">' + b.name + '</span>';
  });
  h += '</div>';
  if (state.bossLog.length) {
    h += '<div class="sec"><h2>Разборы кейсов</h2>';
    state.bossLog.forEach(function(b){
      h += '<div class="kv"><span>' + esc(b.t) + '<br/><span class="small muted">' + b.d + '</span></span>' +
           '<span class="mid">' + b.score + '</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="sec"><h2>Журнал</h2>';
  if (!state.log.length) h += '<div class="small muted">Пусто</div>';
  state.log.slice(0, 20).forEach(function(l){
    h += '<div class="kv small"><span>' + esc(l.t) + '</span><span class="muted">' + l.d + '</span></div>';
  });
  h += '</div><div class="small muted" style="text-align:center;margin:26px 0 10px">Вектор v' + APP_VERSION + '</div>';
  return h;
}

function screenResult(){
  var a = avgScore(), weak = weakest().slice(0, 3), strong = weakest().slice().reverse().slice(0, 2);
  var h = '<div class="eyebrow">Срез компетенций · ' + (state.quizAt || today()) + '</div>' +
    '<div class="logo">ВЕКТОР' + ARROW + '</div><div class="rule"></div>';

  h += '<div class="fade" style="padding-top:22px"><div class="row" style="align-items:flex-end">' +
       '<div><div class="big" style="font-size:76px">' + a.toFixed(1) + '</div>' +
       '<div class="eyebrow" style="margin-top:8px">Средний балл из 5</div></div>' +
       '<div style="text-align:right"><div class="mid gold">' + (a >= 4 ? "на планке" : "ниже планки") + '</div>' +
       '<div class="small muted" style="margin-top:4px">директора — 4,0</div></div></div>' +
       '<div class="bar" style="margin-top:16px"><i style="width:' + Math.round(a/5*100) + '%"></i></div></div>';

  h += '<div class="sec"><h2>Заключение</h2><p class="body" style="margin:0;font-size:17px">' +
       overallVerdict() + '</p></div>';

  h += '<div class="sec"><h2>Карта</h2>' + radar() + '</div>';

  h += '<div class="sec"><h2>Три провала — сюда пойдут карточки</h2>';
  weak.forEach(function(c, i){
    var v = VERDICTS[c.id], s = scoreOf(c.id);
    h += '<div style="padding:20px 0;border-bottom:1px solid #E4E1DA">' +
      '<div class="row" style="align-items:flex-start"><div style="display:flex;gap:16px">' +
      '<span class="num gold">' + (i+1) + '</span>' +
      '<span style="font-size:18px;font-weight:700;letter-spacing:-.02em;padding-top:7px">' + c.full + '</span></div>' +
      '<span class="mid">' + s.toFixed(1) + '</span></div>' +
      '<p class="body" style="margin:12px 0 0">' + v[bandOf(s)] + '</p>' +
      '<div class="act" style="margin-top:14px"><div class="eyebrow gold">С чего начать</div>' +
      '<div style="margin-top:8px;font-size:16px;line-height:1.45">' + v.fix + '</div></div></div>';
  });
  h += '</div>';

  h += '<div class="sec"><h2>На что опираться</h2>';
  strong.forEach(function(c){
    var s = scoreOf(c.id);
    h += '<div style="padding:16px 0;border-bottom:1px solid #E4E1DA">' +
      '<div class="row"><span style="font-size:17px;font-weight:700;letter-spacing:-.02em">' + c.full + '</span>' +
      '<span class="mid">' + s.toFixed(1) + '</span></div>' +
      '<p class="body muted" style="margin:8px 0 0">' + VERDICTS[c.id][bandOf(s)] + '</p></div>';
  });
  h += '</div>';

  h += '<div class="sec"><h2>Что дальше</h2>' +
    '<div class="kv"><span>Каждый день</span><span>3 карточки по провалам</span></div>' +
    '<div class="kv"><span>Через две недели</span><span>первый босс-кейс</span></div>' +
    '<div class="kv"><span>Через квартал</span><span>повторный срез и сравнение</span></div>' +
    '<button class="primary wide" onclick="ui.result=false;ui.tab=\'today\';render()">Перейти к плану</button></div>';
  return h;
}

function tabs(){
  var t = [["today","Сегодня"],["map","Карта"],["rewards","Награды"],["progress","Прогресс"]];
  return '<div class="tabs">' + t.map(function(x){
    return '<button class="' + (ui.tab === x[0] ? "on" : "") + '" onclick="ui.tab=\'' + x[0] + '\';ui.bossOpen=false;render()">' +
           x[1] + '</button>';
  }).join("") + '</div>';
}

function render(){
  var h;
  var inQuiz = ui.retake || (!state.scores && (ui.started || state.qi > 0 || state.answers.length > 0));
  if (inQuiz) h = screenQuiz();
  else if (ui.result && state.scores) h = screenResult();
  else if (!state.scores) h = screenIntro();
  else {
    newDayIfNeeded();
    h = ui.tab === "map" ? tabMap() : ui.tab === "rewards" ? tabRewards() :
        ui.tab === "progress" ? tabProgress() : tabToday();
    h = tabs() + '<div class="page">' + h + '</div>';
    document.getElementById("app").innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }
  h = '<div class="page">' + h + '</div>';
  document.getElementById("app").innerHTML = h;
}

var lastWake = 0;
function wakeUp(){
  if (Date.now() - lastWake < 20000) return;
  lastWake = Date.now();
  newDayIfNeeded(); render();
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") wakeUp(); });
window.addEventListener("focus", wakeUp);

render();
</script>
