<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Переход по ссылке</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#222;background:#fff}
  p{margin:0;padding:24px;text-align:center;font-size:17px}
  a{color:#0a84ff}
</style>
</head>
<body>
<p id="msg">Открываем…<br><a id="lnk" href="#" style="display:none">Открыть вручную</a></p>
<script>
(function () {
  var COUNTER = 0;
  var BEACON  = "https://tg-clicks.vercel.app/api/click";
  var ALLOWED = ["t.me","telegram.me","telegram.dog","pmexcellence.com","www.pmexcellence.com","pm-excellence.ru","www.pm-excellence.ru"];

  var q  = new URLSearchParams(location.search);
  var k  = (q.get("k") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
  var to = q.get("to") || "";
  var ok = false;
  try { var u = new URL(to); ok = u.protocol === "https:" && ALLOWED.indexOf(u.hostname.toLowerCase()) >= 0; } catch (e) {}
  if (!ok || !k) { document.getElementById("msg").textContent = "Ссылка повреждена."; return; }

  var a = document.getElementById("lnk"); a.href = to; a.style.display = "inline";
  var done = false;
  function go() { if (done) return; done = true; location.replace(to); }
  if (navigator.webdriver) { go(); return; }

  // Маяк в таблицу (не задерживает переход)
  try {
    var b = BEACON + "?k=" + encodeURIComponent(k);
    if (navigator.sendBeacon) navigator.sendBeacon(b, ""); else { var im = new Image(); im.src = b + "&_=" + Date.now(); }
  } catch (e) {}

  // Без счётчика — сразу переход
  if (!COUNTER) { go(); return; }

  // Яндекс Метрика: виртуальный просмотр /tg/<ключ>, затем переход
  var timer = setTimeout(go, 1200);
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
  k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
  (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
  ym(COUNTER, "init", { defer: true, clickmap: false, trackLinks: false, accurateTrackBounce: false, webvisor: false });
  ym(COUNTER, "hit", "/tg/" + k, { title: "tg " + k, callback: function () { clearTimeout(timer); go(); } });
})();
</script>
</body>
</html>
