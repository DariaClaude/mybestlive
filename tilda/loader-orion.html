<!-- ОРИОН — загрузчик для Тильды (блок T123).
     Вставить этот короткий код целиком. Сам лендинг подтягивается
     из GitHub: DariaClaude/mybestlive → папка tilda/orion.html -->
<div id="or-embed" style="min-height:100vh;background:#020617;"></div>
<script>
(function(){
  var URL = 'https://cdn.jsdelivr.net/gh/DariaClaude/mybestlive@main/tilda/orion.html';
  var host = document.getElementById('or-embed');
  fetch(URL).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(html){
    host.innerHTML = html;
    /* пересоздаём скрипты — иначе браузер их не выполнит */
    host.querySelectorAll('script').forEach(function(old){
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }).catch(function(e){
    host.innerHTML = '<p style="color:#fff;padding:40px;font-family:sans-serif;">Не удалось загрузить страницу. Проверьте, что файл tilda/orion.html есть в репозитории. ('+e.message+')</p>';
  });
})();
</script>
